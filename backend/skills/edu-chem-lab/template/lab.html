<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学虚拟实验台</title>
  <style>
    :root {
      --wood: #c4a574; --wood-dark: #8b6914;
      --ink: #1e293b; --muted: #64748b; --line: #e2e8f0;
      --ok: #16a34a; --bad: #dc2626; --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; height: auto; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: #e8eef5; display: flex; flex-direction: column;
      min-height: 100%;
    }
    header {
      padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0;
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 2px 0 0; font-size: 12px; color: var(--accent); }
    .badge {
      font-size: 11px; font-weight: 600; color: var(--accent);
      background: #ccfbf1; border-radius: 999px; padding: 2px 10px;
    }
    .eq {
      margin-left: auto; font-size: 13px; background: #f8fafc; border: 1px solid var(--line);
      border-radius: 10px; padding: 6px 10px; font-family: ui-serif, serif;
    }
    .wrap {
      flex: 1; display: grid; grid-template-columns: 176px minmax(0, 1fr) 220px;
      min-height: 540px; min-width: 0;
    }
    @media (max-width: 640px) {
      .wrap { grid-template-columns: 1fr; min-height: 0; }
      .cabinet { border-right: 0; border-bottom: 1px solid var(--line); max-height: 200px; }
      .log-col { border-left: 0; border-top: 1px solid var(--line); min-height: 180px; }
      .stage { min-height: 300px; }
    }
    .cabinet, .log-col { background: #fff; overflow: auto; min-width: 0; }
    .cabinet { border-right: 1px solid var(--line); padding: 10px; }
    .log-col { border-left: 1px solid var(--line); padding: 12px; }
    .sec-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 8px 0; }
    .tiles { display: flex; flex-wrap: wrap; gap: 8px; }
    .tile {
      width: 76px; border: 1px solid var(--line); background: #fff; border-radius: 12px;
      padding: 6px 4px 8px; cursor: grab; user-select: none; text-align: center;
      box-shadow: 0 1px 0 #fff inset, 0 4px 8px rgba(15,23,42,.06);
      touch-action: none;
    }
    .tile:active { cursor: grabbing; }
    .tile.placed { opacity: .38; cursor: default; filter: grayscale(.4); }
    .tile.wrong { border-color: var(--bad); background: #fef2f2; }
    .tile .ico { height: 44px; display: flex; align-items: center; justify-content: center; }
    .tile .ico svg { width: 40px; height: 40px; }
    .tile span { display: block; font-size: 11px; line-height: 1.25; color: var(--ink); }
    .stage {
      background: linear-gradient(#cfe4f8 0 48%, #9bb4c9 48% 52%, #c4a574 52%);
      position: relative; min-height: 300px; min-width: 0; display: flex; flex-direction: column;
    }
    .stage svg.scene { flex: 1; width: 100%; height: auto; min-height: 260px; max-height: 420px; }
    .hidden { display: none !important; }
    .hint-bar {
      background: rgba(255,255,255,.94); margin: 10px; border-radius: 12px; padding: 10px 12px;
      font-size: 13px; border: 1px solid var(--line);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px 12px; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; font-size: 14px;
      font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
    }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .choice {
      display: block; width: 100%; text-align: left; margin-bottom: 8px;
      border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px;
      font-size: 13px; cursor: pointer;
    }
    .choice:hover { border-color: var(--accent); }
    .toast {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      max-width: 90%; background: #111827; color: #fff; border-radius: 12px;
      padding: 10px 14px; font-size: 13px; display: none; z-index: 5;
    }
    .toast.bad { background: #991b1b; }
    .toast.ok { background: #166534; }
    .ghost {
      position: fixed; z-index: 80; pointer-events: none;
      background: #fff; border: 2px solid var(--accent); border-radius: 12px;
      padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--accent);
      box-shadow: 0 12px 28px rgba(15,23,42,.22);
    }
    .step { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
    .step.now { color: var(--ink); font-weight: 700; }
    .step.done { color: var(--ok); }
    .obs { font-size: 13px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
    .hazard { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    #liquid.pink { fill: #f9a8d4; }
    #liquid.pale { fill: #fce7f3; }
    #liquid.clear { fill: #7dd3fc; }
    #lime-liquid.milky { fill: #f8fafc; }
    .flame { animation: flicker .18s infinite alternate; }
    @keyframes flicker { from { opacity: .7; transform: scaleY(.92); } to { opacity: 1; transform: scaleY(1); } }
    .bubble { animation: up 1.2s ease-in infinite; }
    @keyframes up { from { transform: translateY(0); opacity: .85; } to { transform: translateY(-18px); opacity: 0; } }
    .slot-pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
  </style>
</head>

  <script>

    var DATA = JSON.parse(document.getElementById('lab-data').textContent);

    var selectedR = {};
    var stepIndex = 0;
    var lockedSelect = false;
    var hazard = 0;
    var okCount = 0;
    var scene = {};
    var drag = null;

    function $(id) { return document.getElementById(id); }
    function report(q, a, correct) {
      try {
        if (window.CW && typeof window.CW.report === 'function') {
          window.CW.report({ component: 'chem_lab', question: q, answer: a, correct: correct });
        }
        if (correct === true && window.CW && window.CW.correct) window.CW.correct(q, a);
        if (correct === false && window.CW && window.CW.wrong) window.CW.wrong(q, a);
      } catch (e) {}
    }
    function toast(msg, kind) {
      var el = $('toast');
      el.textContent = msg;
      el.className = 'toast ' + (kind || '');
      el.style.display = 'block';
      setTimeout(function () { el.style.display = 'none'; }, 2200);
    }
    function addLog(text, bad) {
      var d = document.createElement('div');
      d.className = 'obs' + (bad ? ' hazard' : '');
      d.textContent = text;
      $('log').prepend(d);
    }
    function current() { return DATA.steps[stepIndex]; }
    function allItems() {
      return [].concat(DATA.inventory.apparatus || [], DATA.inventory.reagents || []);
    }
    function nameOf(id) {
      var list = allItems();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
      return id;
    }
    function activeSvg() {
      var map = {
        oxygen: 'svg-oxygen', neutralization: 'svg-neutralization', electrolysis: 'svg-electrolysis',
        filtration: 'svg-filtration', evaporation: 'svg-evaporation'
      };
      return $(map[DATA.scene] || 'svg-oxygen');
    }
    function isPlaced(id, reagent) {
      return reagent ? !!selectedR[id] : !!selectedA[id];
    }

      $('badge').textContent = DATA.badge || '虚拟实验台';
      $('title').textContent = DATA.title;
      $('subtitle').textContent = DATA.subtitle || '';

        var el = $('svg-' + k);
        if (el) el.classList.toggle('hidden', DATA.scene !== k);
      });
    }

    function makeTile(item, reagent) {
      var b = document.createElement('div');
      var placed = isPlaced(item.id, reagent);
      b.className = 'tile' + (placed ? ' placed' : '');
      b.innerHTML = '<div class="ico">' + (ICO[item.id] || ICO.beaker) + '</div><span>' + item.name + '</span>';
      b.addEventListener('pointerdown', function (e) {
        if (e.button != null && e.button !== 0) return;
        startDrag(e, item, reagent);
      });
      return b;
    }

    function renderCabinet() {
      var aBox = $('apparatus'); var rBox = $('reagents');
      aBox.innerHTML = ''; rBox.innerHTML = '';
      (DATA.inventory.apparatus || []).forEach(function (item) { aBox.appendChild(makeTile(item, false)); });
      (DATA.inventory.reagents || []).forEach(function (item) { rBox.appendChild(makeTile(item, true)); });
    }

    function renderSteps() {
      var box = $('steps'); box.innerHTML = '';
      DATA.steps.forEach(function (s, i) {
        var d = document.createElement('div');
        d.className = 'step' + (i < stepIndex ? ' done' : i === stepIndex ? ' now' : '');
        d.textContent = (i + 1) + '. ' + s.title;
        box.appendChild(d);
      });
    }

    function neededSlots() {
      var set = {};
      allItems().forEach(function (it) {
        if (it.slot && !isPlaced(it.id, (DATA.inventory.reagents || []).some(function (r) { return r.id === it.id; }))) {
          set[it.slot] = true;
        }
      });
      return set;
    }

    function refreshSlots() {
      var selecting = current() && current().need === 'select' && !lockedSelect;
      var need = neededSlots();
      document.querySelectorAll('[data-slot]').forEach(function (el) {
        var slot = el.getAttribute('data-slot');
        var show = selecting && !!need[slot];
        el.classList.toggle('hidden', !show);
      });
    }

    function refreshPieces() {
      document.querySelectorAll('[data-piece]').forEach(function (el) {
        var id = el.getAttribute('data-piece');
        var on = !!selectedA[id];
        el.classList.toggle('hidden', !on);
      });
    }

    function applyScene(extra) {
      extra = extra || {};
      if (!scene._boot && DATA.scene_init) {
        Object.keys(DATA.scene_init).forEach(function (k) { scene[k] = DATA.scene_init[k]; });
        scene._boot = true;
      }
      Object.keys(extra).forEach(function (k) { scene[k] = extra[k]; });
      refreshPieces();
      function on(id, yes) { var el = $(id); if (el) el.classList.toggle('hidden', !yes); }
      if (DATA.scene === 'oxygen') {
        on('powder', !!scene.powder);
        on('zinc', !!scene.zinc);
        on('marble', !!scene.marble);
        on('acid-fill', !!scene.acid);
        on('flame', !!scene.flame);
        on('bubbles', !!scene.bubbles);
        on('gas', !!scene.collected && !scene.air_collect);
        on('bottle-water-collect', !scene.air_collect);
        on('bottle-up', !!scene.air_collect);
        on('pop', !!scene.pop);
        on('jet-flame', !!scene.jet_flame);
        on('sparks', !!scene.sparks);
        on('bottle-water', !!scene.bottle_water);
        var limeLiq = $('lime-liquid');
        if (limeLiq) limeLiq.classList.toggle('milky', !!scene.lime_milky);
        var tube = $('tube');
        if (tube) {
          var rot = scene.upright ? 0 : (scene.tilt_up ? 18 : -16);
          tube.setAttribute('transform', 'translate(154,72) rotate(' + rot + ')');
        }
      }
      if (DATA.scene === 'neutralization') {
        on('dropper', !!selectedA.dropper);
        on('drip', !!scene.dripping);
        on('metal-bit', !!scene.metal);
        on('beaker-bubbles', !!scene.acid_bubbles);
        var liq = $('liquid');
        if (liq) {
          liq.classList.remove('pink', 'pale', 'clear');
          liq.classList.add(scene.liquid || 'clear');
        }
      }
      if (DATA.scene === 'electrolysis') {
        on('el-h2', !!scene.gases);
        on('el-o2', !!scene.gases);
        on('el-ratio', !!scene.ratio);
      }
      if (DATA.scene === 'filtration') {
        on('filter-paper', !!scene.paper || !!selectedA.paper);
        on('filter-rod', !!scene.drain);
        on('residue', !!scene.residue);
        on('filtrate', !!scene.filtrate);
      }
      if (DATA.scene === 'evaporation') {
        on('evap-flame', !!scene.heat);
        on('steam', !!scene.heat);
        on('evap-rod', !!selectedA.rod);
        on('crystals', !!scene.crystals);
        var dish = $('dish-liquid');
        if (dish) dish.style.opacity = scene.crystals ? '0.35' : '1';
      }
      refreshSlots();
    }

    function missingRequired() {
      var miss = [];
      (DATA.required_apparatus || []).forEach(function (id) { if (!selectedA[id]) miss.push(id); });
      (DATA.required_reagents || []).forEach(function (id) { if (!selectedR[id]) miss.push(id); });
      return miss;
    }

    function tryFinishSelect() {
      if (missingRequired().length) return;
      lockedSelect = true;
      okCount += 1;
      addLog('仪器已放到工位，药品已加入容器。', false);
      report(current().title, '拖放组装完成', true);
      toast('组装完成，开始实验', 'ok');
      next();
    }

    function placeItem(item, reagent) {
      if (reagent) selectedR[item.id] = true;
      else selectedA[item.id] = true;
      renderCabinet();
      applyScene({});
      addLog('已放置：' + item.name, false);
      report(current().title, '放置 ' + item.name, true);
      tryFinishSelect();
    }

    function slotHits(x, y) {
      var svg = activeSvg();
      var hits = [];
      if (!svg) return hits;
      var nodes = svg.querySelectorAll('[data-slot]');
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].classList.contains('hidden')) continue;
        var r = nodes[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          hits.push(nodes[i].getAttribute('data-slot'));
        }
      }
      return hits;
    }

    function startDrag(e, item, reagent) {
      if (lockedSelect || !current() || current().need !== 'select') return;
      if (isPlaced(item.id, reagent)) return;
      e.preventDefault();
      var g = $('ghost');
      g.textContent = item.name;
      g.classList.remove('hidden');
      drag = { item: item, reagent: reagent, ghost: g };
      moveGhost(e);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }
    function moveGhost(e) {
      if (!drag) return;
      drag.ghost.style.left = (e.clientX + 12) + 'px';
      drag.ghost.style.top = (e.clientY + 12) + 'px';
    }
    function onMove(e) { moveGhost(e); }
    function onUp(e) {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if (!drag) return;
      drag.ghost.classList.add('hidden');
      var hits = slotHits(e.clientX, e.clientY);
      var want = drag.item.slot || '';
      var item = drag.item;
      var reagent = drag.reagent;
      drag = null;
      if (want && hits.indexOf(want) >= 0) {
        placeItem(item, reagent);
        return;
      }
      hazard += 1;
      addLog((want ? '工位不对：' : '这件东西本实验不用：') + item.name, true);
      report(current().title, '放错 ' + item.name, false);
      toast(want ? '放到对应的虚线工位上' : '这件不是本实验需要的', 'bad');
      renderCabinet();
      var tiles = document.querySelectorAll('.tile');
      tiles.forEach(function (t) {
        if (t.textContent.indexOf(item.name) >= 0) {
          t.classList.add('wrong');
          setTimeout(function () { t.classList.remove('wrong'); }, 1200);
        }
      });
    }

    function next(sceneExtra) {
      stepIndex += 1;
      if (stepIndex >= DATA.steps.length) {
        finish();
        return;
      }
      renderSteps();
      renderActions();
      applyScene(sceneExtra || {});
    }
    function finish() {
      lockedSelect = true;
      $('step-hint').textContent = DATA.complete.title + ' · ' + DATA.complete.summary;
      $('actions').innerHTML = '';
      addLog(DATA.complete.summary, false);
      addLog('正确操作 ' + okCount + ' 步' + (hazard ? '，安全失误 ' + hazard + ' 次，请对照步骤再练。' : '，没有安全失误。'), hazard > 0);
      report(DATA.title, '完成实验', true);
      toast('实验完成', 'ok');
      renderSteps();
      refreshSlots();
    }
    function renderActions() {
      var s = current();
      if (!s) return;
      $('step-hint').textContent = s.title + '：' + (s.hint || '');
      var box = $('actions'); box.innerHTML = '';
      if (s.need === 'select') {
        var tip = document.createElement('p');
        tip.className = 'hint-bar';
        tip.style.margin = '0';
        tip.textContent = '从左侧拖器材到台面虚线工位，药品拖到「药品」工位。放对会卡住，全部放对后自动进入下一步。';
        box.appendChild(tip);
      } else if (s.need === 'action') {
        var b = document.createElement('button');
        b.className = 'btn'; b.textContent = s.action_label || '执行操作';
        b.onclick = function () {
          okCount += 1;
          if (s.phenomenon) addLog(s.phenomenon, false);
          report(s.title, s.action_label || '操作', true);
          toast(s.phenomenon || '操作完成', 'ok');
          next(s.scene || {});
        };
        box.appendChild(b);
      } else if (s.need === 'choice') {
        (s.choices || []).forEach(function (c) {
          var btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'choice'; btn.textContent = c.label;
          btn.onclick = function () {
            if (c.correct) {
              okCount += 1;
              addLog(c.ok || '操作正确。', false);
              report(s.title, c.label, true);
              toast(c.ok || '正确', 'ok');
              var sc = Object.assign({}, s.scene || {}, c.scene || {});
              if (c.id === 'tilt_down') sc.tilt_down = true;
              if (c.id === 'tilt_up') sc.tilt_up = true;
              next(sc);
            } else {
              hazard += 1;
              addLog(c.hazard || '这样不安全。', true);
              report(s.title, c.label, false);
              toast(c.hazard || '请重新选择', 'bad');
            }
          };
          box.appendChild(btn);
        });
      }
    }

    renderHeader();
    renderCabinet();
    renderSteps();
    renderActions();
    applyScene({});
  })();
  </script>
</body>
</html>
