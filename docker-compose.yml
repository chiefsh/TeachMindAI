x-timezone: &timezone
  TZ: Asia/Shanghai

x-celery-worker: &celery-worker
  build: ./backend
  restart: always
  environment:
    <<: *timezone
    DATABASE_URL: mysql+aiomysql://edu_user:edu_pass@mysql:3306/edu_platform
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://edu_user:edu_pass@rabbitmq:5672/
    MINIO_ENDPOINT: minio:9000
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-edu_minio_user}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-edu_minio_pass}
    SECRET_KEY: your-secret-key-change-in-production
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: edu_neo4j_pass
    QDRANT_URL: http://qdrant:6333
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  depends_on:
    - rabbitmq
    - mysql
    - redis
    - neo4j
    - qdrant
  volumes:
    - ./backend:/app

services:
  mysql:
    image: mysql:8.0
    container_name: edu_mysql
    restart: always
    environment:
      <<: *timezone
      MYSQL_ROOT_PASSWORD: edu_root_pass
      MYSQL_DATABASE: edu_platform
      MYSQL_USER: edu_user
      MYSQL_PASSWORD: edu_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00

  redis:
    image: redis:7-alpine
    container_name: edu_redis
    restart: always
    environment:
      <<: *timezone
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: edu_rabbitmq
    restart: always
    environment:
      <<: *timezone
      RABBITMQ_DEFAULT_USER: edu_user
      RABBITMQ_DEFAULT_PASS: edu_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: edu_minio
    restart: always
    environment:
      <<: *timezone
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-edu_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-edu_minio_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  neo4j:
    image: neo4j:5.24-community
    container_name: edu_neo4j
    restart: always
    environment:
      <<: *timezone
      NEO4J_AUTH: neo4j/edu_neo4j_pass
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: edu_qdrant
    restart: always
    environment:
      <<: *timezone
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: edu_backend
    restart: always
    environment:
      <<: *timezone
      DATABASE_URL: mysql+aiomysql://edu_user:edu_pass@mysql:3306/edu_platform
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://edu_user:edu_pass@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-edu_minio_user}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-edu_minio_pass}
      SECRET_KEY: your-secret-key-change-in-production
      ENVIRONMENT: development
      ENABLE_REGIST: "${ENABLE_REGIST:-false}"
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@local}
      SUPER_ADMIN_REAL_NAME: ${SUPER_ADMIN_REAL_NAME:-超级管理员}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: edu_neo4j_pass
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio
      - neo4j
      - qdrant
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker_fast:
    <<: *celery-worker
    container_name: edu_celery_fast
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q fast_tasks --concurrency=${CELERY_WORKER_CONCURRENCY:-2}

  celery_worker_slow:
    <<: *celery-worker
    container_name: edu_celery_slow
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q slow_tasks --concurrency=${CELERY_WORKER_CONCURRENCY:-2}

  frontend:
    build: ./frontend
    container_name: edu_frontend
    restart: always
    environment:
      <<: *timezone
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
