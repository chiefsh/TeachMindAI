<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理探究</title>
  <style>
    :root {
      --ink: #1a365d; --muted: #5b6b7c; --line: #c5d4e4;
      --accent: #0171c3; --play: #e8f3fb; --dock: #eef2f6;
      --reset: #f5d76e; --panel: rgba(255,255,255,.92);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #123; background: #9ec9ea; display: flex; flex-direction: column;
    }
    .play {
      flex: 1; min-height: 0; position: relative;
      background:
        radial-gradient(900px 420px at 50% 0%, #f7fbff, transparent 60%),
        linear-gradient(#cfe6f7, #eaf4fb 55%, #d7e8c8 55%, #c5d9a8);
    }
    #view { position: absolute; inset: 0 268px 92px 0; }
    #view svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #view svg:active { cursor: grabbing; }
    .hud-top {
      position: absolute; left: 14px; top: 12px; z-index: 3;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 8px 14px 10px; max-width: min(420px, 46%);
      box-shadow: 0 10px 28px rgba(15,40,70,.12);
    }
    .badge {
      font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); background: #d6ecff; border-radius: 999px; padding: 2px 8px;
    }
    .hud-top h1 { margin: 4px 0 0; font-size: 17px; }
    .hud-top p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .eq {
      margin-top: 6px; display: inline-block; font-size: 13px;
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 3px 9px; font-family: ui-serif, Georgia, serif; color: var(--accent);
    }
    .labpad {
      position: absolute; right: 12px; top: 12px; bottom: 92px; width: 248px; z-index: 3;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 12px; display: flex; flex-direction: column;
      box-shadow: 0 10px 28px rgba(15,40,70,.12);
    }
    .sec { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
    .meters { display: grid; gap: 6px; margin-bottom: 10px; }
    .meter {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px;
    }
    .meter .k { font-size: 11px; color: var(--muted); }
    .meter .v { font-size: 18px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
    #detail { flex: 1; min-height: 0; overflow: auto; font-size: 13px; line-height: 1.55; color: #334; }
    #detail h2 { margin: 0 0 6px; font-size: 15px; color: var(--ink); }
    #detail .hint { color: var(--accent); font-weight: 700; margin: 0 0 6px; }
    #detail .mist { margin: 8px 0 0; padding: 8px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; color: #9a3412; font-size: 12px; }
    .choice {
      display: block; width: 100%; text-align: left; margin: 0 0 8px;
      border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 10px;
      font-size: 13px; cursor: pointer;
    }
    .choice:hover { border-color: var(--accent); }
    .dock {
      position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 3; height: 74px;
      background: var(--dock); border: 1px solid var(--line); border-radius: 16px;
      display: flex; align-items: center; gap: 14px; padding: 8px 12px;
      box-shadow: 0 8px 22px rgba(15,40,70,.12);
    }
    .sliders { display: flex; gap: 16px; flex: 1; min-width: 0; overflow-x: auto; }
    .slider { min-width: 140px; }
    .slider label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .slider input { width: 100%; accent-color: var(--accent); }
    .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
    .toggles label { font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 13px;
      font-weight: 800; cursor: pointer; background: var(--accent); color: #fff;
    }
    .btn.reset { background: var(--reset); color: #3a2a00; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .toast {
      position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
      background: #123; color: #fff; border-radius: 12px; padding: 8px 14px;
      font-size: 13px; display: none; z-index: 6;
    }
    .toast.bad { background: #9f1239; }
    .toast.ok { background: #14532d; }
    @media (max-width: 820px) {
      #view { inset: 88px 8px 168px 8px; }
      .labpad { left: 8px; right: 8px; top: auto; bottom: 92px; width: auto; height: 68px; flex-direction: row; gap: 10px; }
      .hud-top { max-width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <div class="play">
    <div class="hud-top">
      <div class="badge" id="badge">物理探究</div>
      <h1 id="title">物理探究</h1>
      <p id="subtitle"></p>
      <div class="eq" id="equation"></div>
    </div>
    <div id="view"></div>
    <aside class="labpad">
      <div class="sec">实时读数</div>
      <div class="meters" id="meters"></div>
      <div class="sec">规律</div>
      <div id="detail"></div>
    </aside>
    <div class="dock" id="dock"></div>
    <div class="toast" id="toast"></div>
  </div>
  <script type="application/json" id="phy-data">{"id": "circular_motion", "sim": "circular", "title": "匀速圆周运动", "subtitle": "速度沿切线，合力指向圆心，F = mv²/r", "badge": "高中物理 · 力学", "equation": "F = mv² / r    a = v² / r", "hint": "改半径和线速度。向心力箭头始终指向圆心；速度越大、半径越小，需要的向心力越大。", "intro": "匀速圆周运动速率不变，但速度方向一直在变，所以有向心加速度。提供向心力的可以是拉力、重力分力、库仑力等，不是一种新的力。", "controls": [{"id": "r", "label": "半径", "min": 0.4, "max": 2.2, "step": 0.1, "value": 1.2, "unit": " m"}, {"id": "v", "label": "线速度", "min": 1, "max": 12, "step": 0.5, "value": 4, "unit": " m/s"}, {"id": "m", "label": "质量", "min": 0.2, "max": 4, "step": 0.2, "value": 1, "unit": " kg"}], "quiz": {"q": "线速度不变，半径减半，所需向心力？", "options": [{"t": "变为 2 倍", "ok": true}, {"t": "变为 1/2", "ok": false, "why": "F = mv²/r，r 减半 F 加倍。"}, {"t": "不变", "ok": false, "why": "分母变了。"}], "ok": "F 与 r 成反比（v 一定）。", "explain": "急弯要减速，就是在减小所需向心力。"}}</script>
  <script>/* PhET 风格物理仿真：拖动物体 / 滑条改参 / 仪表即时反馈。 */
(function () {
  var DATA = JSON.parse(document.getElementById("phy-data").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var svg, playing = true, lastTs = 0, toastTimer = 0, simT = 0;
  var S = {};
  var drag = null;

  function $(id) { return document.getElementById(id); }
  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function fmt(n, d) { return Number(n).toFixed(d == null ? 1 : d); }
  function report(ok, q, a) {
    try {
      if (ok) window.CW && window.CW.correct && window.CW.correct(q, a);
      else window.CW && window.CW.wrong && window.CW.wrong(q, a);
    } catch (e) {}
  }
  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast " + (bad ? "bad" : "ok");
    t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = "none"; }, 2200);
  }

  function pt(ev) {
    var ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    var p = svg.createSVGPoint();
    p.x = ev.clientX; p.y = ev.clientY;
    return p.matrixTransform(ctm.inverse());
  }

  function setMeters(rows) {
    var box = $("meters");
    box.innerHTML = rows.map(function (r) {
      return '<div class="meter"><div class="k">' + r.k + '</div><div class="v">' + r.v + "</div></div>";
    }).join("");
  }

  function setDetail(html) { $("detail").innerHTML = html; }

  function showIntro() {
    var qbtn = DATA.quiz
      ? '<p style="margin-top:10px"><button class="btn" type="button" id="quiz-btn">检测一下</button></p>'
      : "";
    setDetail(
      "<h2>" + (DATA.title || "") + "</h2>" +
      "<p class='hint'>" + (DATA.hint || "拖动图中物体，或拉动下方滑条。") + "</p>" +
      "<div>" + (DATA.intro || "") + "</div>" + qbtn
    );
    var b = $("quiz-btn");
    if (b) b.onclick = showQuiz;
  }

  function showQuiz() {
    var quiz = DATA.quiz;
    if (!quiz) return;
    $("detail").innerHTML = "<h2>" + quiz.q + "</h2>";
    (quiz.options || []).forEach(function (opt) {
      var btn = document.createElement("button");
      btn.className = "choice"; btn.type = "button"; btn.textContent = opt.t;
      btn.onclick = function () {
        report(!!opt.ok, quiz.q, opt.t);
        toast(opt.ok ? (quiz.ok || "正确") : (opt.why || "再调一调参数看看"), !opt.ok);
        if (opt.ok) $("detail").innerHTML += "<p class='hint'>" + (quiz.explain || "") + "</p>";
      };
      $("detail").appendChild(btn);
    });
  }

  function ctrl(id) {
    var list = DATA.controls || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return Number(S[id]);
    return 0;
  }
  function tog(id) { return !!S["tog_" + id]; }
  function ctrlMeta(id) {
    var list = DATA.controls || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function setCtrl(id, val) {
    var c = ctrlMeta(id);
    if (!c) return;
    val = clamp(val, Number(c.min), Number(c.max));
    S[id] = val;
    var inp = $("c-" + id);
    if (inp) inp.value = String(val);
    var lab = $("lab-" + id);
    if (lab) lab.textContent = fmt(val, Number(c.step) < 1 ? 1 : 0) + (c.unit || "");
  }

  function renderDock() {
    var dock = $("dock");
    var html = '<div class="sliders">';
    (DATA.controls || []).forEach(function (c) {
      html += '<div class="slider"><label><span>' + c.label + '</span><span id="lab-' + c.id + '">' +
        c.value + (c.unit || "") + "</span></label>" +
        '<input id="c-' + c.id + '" type="range" min="' + c.min + '" max="' + c.max +
        '" step="' + (c.step || 1) + '" value="' + c.value + '"></div>';
    });
    html += '</div><div class="toggles">';
    (DATA.toggles || []).forEach(function (t) {
      html += '<label><input id="t-' + t.id + '" type="checkbox"' + (t.on ? " checked" : "") + "> " + t.label + "</label>";
    });
    html += "</div>";
    if (DATA.needPlay !== false) html += '<button class="btn ghost" id="btn-play" type="button">暂停</button>';
    html += '<button class="btn reset" id="btn-reset" type="button">全部重置</button>';
    dock.innerHTML = html;
    (DATA.controls || []).forEach(function (c) {
      S[c.id] = c.value;
      $("c-" + c.id).oninput = function () {
        S[c.id] = Number(this.value);
        $("lab-" + c.id).textContent = fmt(S[c.id], c.step < 1 ? 1 : 0) + (c.unit || "");
        if (engine.onChange) engine.onChange();
        engine.draw();
      };
    });
    (DATA.toggles || []).forEach(function (t) {
      S["tog_" + t.id] = !!t.on;
      $("t-" + t.id).onchange = function () {
        S["tog_" + t.id] = this.checked;
        engine.draw();
      };
    });
    if ($("btn-play")) $("btn-play").onclick = function () {
      playing = !playing;
      this.textContent = playing ? "暂停" : "播放";
    };
    $("btn-reset").onclick = function () { resetAll(); };
  }

  function resetAll() {
    (DATA.controls || []).forEach(function (c) {
      S[c.id] = c.value;
      var inp = $("c-" + c.id);
      if (inp) inp.value = c.value;
      var lab = $("lab-" + c.id);
      if (lab) lab.textContent = c.value + (c.unit || "");
    });
    (DATA.toggles || []).forEach(function (t) {
      S["tog_" + t.id] = !!t.on;
      var inp = $("t-" + t.id);
      if (inp) inp.checked = !!t.on;
    });
    simT = 0; S.t = 0;
    if (engine.reset) engine.reset();
    engine.draw();
    toast("已重置", false);
  }

  function startDrag(hit, ev) {
    drag = hit;
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) return;
    var p = pt(ev);
    if (engine.drag) engine.drag(drag, p.x, p.y);
    engine.draw();
  }
  function onUp() {
    drag = null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  }

  /* ── engines ─────────────────────────────────────────── */
  var engine = { draw: function () {}, reset: function () {}, step: function () {}, hit: function () { return null; } };

  function magnetSim() {
    S.cx = 520; S.cy = 340;
    return {
      reset: function () { S.cx = 520; S.cy = 340; },
      hit: function (p) {
        if (Math.hypot(p.x - S.cx, p.y - S.cy) < 46) return "compass";
        return null;
      },
      drag: function (id, x, y) {
        if (id === "compass") { S.cx = clamp(x, 80, 820); S.cy = clamp(y, 70, 500); }
      },
      field: function (x, y) {
        var mx = 360, my = 250, half = 70;
        var nx = mx - half, ny = my, sx = mx + half, sy = my;
        function pole(px, py, sign) {
          var dx = x - px, dy = y - py, r2 = dx * dx + dy * dy + 90;
          var r3 = Math.pow(r2, 1.5);
          return { x: sign * dx / r3, y: sign * dy / r3 };
        }
        var n = pole(nx, ny, 1), s = pole(sx, sy, -1);
        return { x: n.x + s.x, y: n.y + s.y };
      },
      draw: function () {
        clear(svg);
        svg.appendChild(el("rect", { width: 900, height: 560, fill: "transparent" }));
        if (S["tog_lines"] !== false) {
          var g = el("g", { fill: "none", stroke: "#64748b", "stroke-width": "1.7", opacity: ".9" });
          for (var a = 0; a < 11; a++) {
            var ang0 = Math.PI / 2 + a * Math.PI / 10;
            var x = 292 + Math.cos(ang0) * 10, y = 250 + Math.sin(ang0) * 36;
            var d = "M" + x + "," + y;
            for (var s = 0; s < 36; s++) {
              var B = this.field(x, y);
              var m = Math.hypot(B.x, B.y) || 1;
              x += 12 * B.x / m; y += 12 * B.y / m;
              if (x < -20 || x > 920 || y < -20 || y > 580) break;
              if (x > 358 && x < 432 && y > 214 && y < 286) break;
              d += " L" + x + "," + y;
            }
            g.appendChild(el("path", { d: d }));
          }
          svg.appendChild(g);
        }
        svg.appendChild(el("rect", { x: 290, y: 215, width: 70, height: 70, rx: 8, fill: "#e11d48" }));
        svg.appendChild(el("rect", { x: 360, y: 215, width: 70, height: 70, rx: 8, fill: "#2563eb" }));
        svg.appendChild(el("text", { x: 325, y: 258, "text-anchor": "middle", fill: "#fff", "font-size": "28", "font-weight": "800" }, "N"));
        svg.appendChild(el("text", { x: 395, y: 258, "text-anchor": "middle", fill: "#fff", "font-size": "28", "font-weight": "800" }, "S"));
        var B = this.field(S.cx, S.cy);
        var ang = Math.atan2(B.y, B.x) * 180 / Math.PI;
        var g2 = el("g", { transform: "translate(" + S.cx + "," + S.cy + ")" });
        g2.appendChild(el("circle", { r: 38, fill: "#fff", stroke: "#1e293b", "stroke-width": "3" }));
        var needle = el("g", { transform: "rotate(" + ang + ")" });
        needle.appendChild(el("polygon", { points: "0,-7 26,0 0,7", fill: "#e11d48" }));
        needle.appendChild(el("polygon", { points: "0,-7 -26,0 0,7", fill: "#0f172a" }));
        needle.appendChild(el("circle", { r: 4.5, fill: "#fff", stroke: "#111", "stroke-width": "1.5" }));
        g2.appendChild(needle);
        g2.appendChild(el("text", { y: 54, "text-anchor": "middle", "font-size": "12" }, "拖动小磁针"));
        svg.appendChild(g2);
        var mag = Math.hypot(B.x, B.y);
        setMeters([
          { k: "磁场方向", v: Math.round(ang) + "°" },
          { k: "相对强弱", v: fmt(mag * 8000, 2) }
        ]);
      }
    };
  }

  function faradaySim() {
    S.mx = 180; S.my = 250; S.emf = 0; S.prevFlux = 0;
    return {
      reset: function () { S.mx = 180; S.my = 250; S.emf = 0; S.prevFlux = 0; },
      hit: function (p) { return (p.x > S.mx - 90 && p.x < S.mx + 90 && p.y > S.my - 50 && p.y < S.my + 50) ? "mag" : null; },
      drag: function (id, x, y) {
        if (id === "mag") { S.mx = clamp(x, 90, 780); S.my = clamp(y, 140, 400); }
      },
      flux: function () {
        var coilX = 520, overlap = 1 - clamp(Math.abs(S.mx - coilX) / 220, 0, 1);
        return overlap * (1 - clamp(Math.abs(S.my - 250) / 160, 0, 1));
      },
      step: function (dt) {
        var fl = this.flux();
        var d = fl - (S.prevFlux || fl);
        S.emf = S.emf * 0.86 + d * 90;
        S.prevFlux = fl;
      },
      draw: function () {
        clear(svg);
        svg.appendChild(el("rect", { x: 430, y: 140, width: 180, height: 220, rx: 18, fill: "none", stroke: "#334155", "stroke-width": "10" }));
        for (var i = 0; i < 6; i++) {
          svg.appendChild(el("ellipse", { cx: 520, cy: 165 + i * 34, rx: 78, ry: 16, fill: "none", stroke: "#64748b", "stroke-width": "3" }));
        }
        svg.appendChild(el("circle", { cx: 740, cy: 250, r: 48, fill: "#fff", stroke: "#111", "stroke-width": "4" }));
        var ang = clamp(S.emf * 40, -55, 55);
        var needle = el("g", { transform: "translate(740,250) rotate(" + ang + ")" });
        needle.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: -36, stroke: "#e11d48", "stroke-width": "3" }));
        svg.appendChild(needle);
        svg.appendChild(el("text", { x: 740, y: 312, "text-anchor": "middle", "font-size": "12" }, "电流计 G"));
        svg.appendChild(el("rect", { x: S.mx - 80, y: S.my - 32, width: 80, height: 64, rx: 6, fill: "#e11d48" }));
        svg.appendChild(el("rect", { x: S.mx, y: S.my - 32, width: 80, height: 64, rx: 6, fill: "#2563eb" }));
        svg.appendChild(el("text", { x: S.mx - 40, y: S.my + 8, "text-anchor": "middle", fill: "#fff", "font-size": "22", "font-weight": "800" }, "N"));
        svg.appendChild(el("text", { x: S.mx + 40, y: S.my + 8, "text-anchor": "middle", fill: "#fff", "font-size": "22", "font-weight": "800" }, "S"));
        svg.appendChild(el("text", { x: S.mx, y: S.my + 52, "text-anchor": "middle", "font-size": "12" }, "拖动磁铁进出线圈"));
        var emfAbs = Math.abs(S.emf);
        setMeters([
          { k: "相对磁通量", v: fmt(this.flux(), 2) },
          { k: "感应电动势", v: (S.emf >= 0 ? "+" : "−") + fmt(emfAbs, 2) },
          { k: "电流", v: emfAbs < 0.04 ? "≈ 0" : (S.emf > 0 ? "正偏" : "反偏") }
        ]);
      }
    };
  }

  function ohmSim() {
    return {
      draw: function () {
        var U = ctrl("U") || 6, R = Math.max(ctrl("R") || 6, 0.5), I = U / R;
        clear(svg);
        var battH = 36 + U * 6;
        svg.appendChild(el("rect", { x: 120, y: 280 - battH / 2, width: 54, height: battH, rx: 6, fill: "#f59e0b", stroke: "#b45309", "stroke-width": "3" }));
        svg.appendChild(el("text", { x: 147, y: 286, "text-anchor": "middle", "font-size": "14", "font-weight": "800" }, fmt(U, 1) + "V"));
        var zig = 10, d = "M240 250";
        for (var i = 0; i < zig; i++) {
          d += " L" + (240 + (i + 0.5) * (320 / zig)) + "," + (250 + (i % 2 ? 20 : -20));
        }
        d += " L560 250";
        svg.appendChild(el("path", { d: d, fill: "none", stroke: "#334155", "stroke-width": "4" }));
        svg.appendChild(el("text", { x: 400, y: 214, "text-anchor": "middle", "font-size": "14" }, "R = " + fmt(R, 1) + " Ω"));
        svg.appendChild(el("circle", { cx: 620, cy: 250, r: 26, fill: "#fff", stroke: "#111", "stroke-width": "3" }));

    $("view").appendChild(svg);
    var make = ENGINES[DATA.sim] || magnetSim;

    if (engine.reset) engine.reset();

    svg.addEventListener("pointerdown", function (ev) {

    requestAnimationFrame(tick);
  }
