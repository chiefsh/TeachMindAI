<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理探究</title>
  <style>
    :root {
      --ink: #1a365d; --muted: #5b6b7c; --line: #c5d4e4;
      --accent: #0171c3; --play: #e8f3fb; --dock: #eef2f6;
      --reset: #f5d76e; --panel: rgba(255,255,255,.92);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #123; background: #9ec9ea; display: flex; flex-direction: column;
    }
    .play {
      flex: 1; min-height: 0; position: relative;
      background:
        radial-gradient(900px 420px at 50% 0%, #f7fbff, transparent 60%),
        linear-gradient(#cfe6f7, #eaf4fb 55%, #d7e8c8 55%, #c5d9a8);
    }
    #view { position: absolute; inset: 0 268px 92px 0; }
    #view svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #view svg:active { cursor: grabbing; }
    .hud-top {
      position: absolute; left: 14px; top: 12px; z-index: 3;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 8px 14px 10px; max-width: min(420px, 46%);
      box-shadow: 0 10px 28px rgba(15,40,70,.12);
    }
    .badge {
      font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); background: #d6ecff; border-radius: 999px; padding: 2px 8px;
    }
    .hud-top h1 { margin: 4px 0 0; font-size: 17px; }
    .hud-top p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .eq {
      margin-top: 6px; display: inline-block; font-size: 13px;
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
      padding: 3px 9px; font-family: ui-serif, Georgia, serif; color: var(--accent);
    }
    .labpad {
      position: absolute; right: 12px; top: 12px; bottom: 92px; width: 248px; z-index: 3;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 12px; display: flex; flex-direction: column;
      box-shadow: 0 10px 28px rgba(15,40,70,.12);
    }
    .sec { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; }
    .meters { display: grid; gap: 6px; margin-bottom: 10px; }
    .meter {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px;
    }
    .meter .k { font-size: 11px; color: var(--muted); }
    .meter .v { font-size: 18px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
    #detail { flex: 1; min-height: 0; overflow: auto; font-size: 13px; line-height: 1.55; color: #334; }
    #detail h2 { margin: 0 0 6px; font-size: 15px; color: var(--ink); }
    #detail .hint { color: var(--accent); font-weight: 700; margin: 0 0 6px; }
    #detail .mist { margin: 8px 0 0; padding: 8px; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; color: #9a3412; font-size: 12px; }
    .choice {
      display: block; width: 100%; text-align: left; margin: 0 0 8px;
      border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 10px;
      font-size: 13px; cursor: pointer;
    }
    .choice:hover { border-color: var(--accent); }
    .dock {
      position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 3; height: 74px;
      background: var(--dock); border: 1px solid var(--line); border-radius: 16px;
      display: flex; align-items: center; gap: 14px; padding: 8px 12px;
      box-shadow: 0 8px 22px rgba(15,40,70,.12);
    }
    .sliders { display: flex; gap: 16px; flex: 1; min-width: 0; overflow-x: auto; }
    .slider { min-width: 140px; }
    .slider label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .slider input { width: 100%; accent-color: var(--accent); }
    .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
    .toggles label { font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 13px;
      font-weight: 800; cursor: pointer; background: var(--accent); color: #fff;
    }
    .btn.reset { background: var(--reset); color: #3a2a00; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .toast {
      position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
      background: #123; color: #fff; border-radius: 12px; padding: 8px 14px;
      font-size: 13px; display: none; z-index: 6;
    }
    .toast.bad { background: #9f1239; }
    .toast.ok { background: #14532d; }
    @media (max-width: 820px) {
      #view { inset: 88px 8px 168px 8px; }
      .labpad { left: 8px; right: 8px; top: auto; bottom: 92px; width: auto; height: 68px; flex-direction: row; gap: 10px; }
      .hud-top { max-width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <div class="play">
    <div class="hud-top">
      <div class="badge" id="badge">物理探究</div>
      <h1 id="title">物理探究</h1>
      <p id="subtitle"></p>
      <div class="eq" id="equation"></div>
    </div>
    <div id="view"></div>
    <aside class="labpad">
      <div class="sec">实时读数</div>
      <div class="meters" id="meters"></div>
      <div class="sec">规律</div>
      <div id="detail"></div>
    </aside>
    <div class="dock" id="dock"></div>
    <div class="toast" id="toast"></div>
  </div>
  <script type="application/json" id="phy-data">{"id": "electromagnetic_induction", "sim": "faraday", "title": "电磁感应", "subtitle": "磁通量变化才产生感应电流；增反减同", "badge": "初中 / 高中物理 · 电磁", "equation": "ε = n ΔΦ / Δt", "hint": "把磁铁推进线圈、再抽出来。电流计只在磁通量变化时偏转；停在里面不动就没有感应电流。", "intro": "闭合回路中磁通量变化时产生感应电动势。楞次定律：感应电流的磁场总要阻碍引起感应电流的磁通量变化（增反减同）。切忌说「有磁就有电」。", "quiz": {"q": "产生感应电流的条件是？", "options": [{"t": "闭合回路的磁通量发生变化", "ok": true}, {"t": "回路附近有磁铁即可", "ok": false, "why": "磁铁静止时没有感应电流。"}, {"t": "线圈必须接电池", "ok": false, "why": "电磁感应不需要外接电源。"}], "ok": "闭合 + 磁通量变化。两者缺一不可。", "explain": "发电机就是不断改变线圈的磁通量。"}}</script>
  <script>/* PhET 风格物理仿真：拖动物体 / 滑条改参 / 仪表即时反馈。 */
(function () {
  var DATA = JSON.parse(document.getElementById("phy-data").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var svg, playing = true, lastTs = 0, toastTimer = 0, simT = 0;
  var S = {};
  var drag = null;

  function $(id) { return document.getElementById(id); }
  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function fmt(n, d) { return Number(n).toFixed(d == null ? 1 : d); }
  function report(ok, q, a) {
    try {
      if (ok) window.CW && window.CW.correct && window.CW.correct(q, a);
      else window.CW && window.CW.wrong && window.CW.wrong(q, a);
    } catch (e) {}
  }
  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast " + (bad ? "bad" : "ok");
    t.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = "none"; }, 2200);
  }

  function pt(ev) {
    var ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    var p = svg.createSVGPoint();
    p.x = ev.clientX; p.y = ev.clientY;
    return p.matrixTransform(ctm.inverse());
  }

  function setMeters(rows) {
    var box = $("meters");
    box.innerHTML = rows.map(function (r) {
      return '<div class="meter"><div class="k">' + r.k + '</div><div class="v">' + r.v + "</div></div>";
    }).join("");
  }

  function setDetail(html) { $("detail").innerHTML = html; }

  function showIntro() {
    var qbtn = DATA.quiz
      ? '<p style="margin-top:10px"><button class="btn" type="button" id="quiz-btn">检测一下</button></p>'
      : "";
    setDetail(
      "<h2>" + (DATA.title || "") + "</h2>" +
      "<p class='hint'>" + (DATA.hint || "拖动图中物体，或拉动下方滑条。") + "</p>" +
      "<div>" + (DATA.intro || "") + "</div>" + qbtn
    );
    var b = $("quiz-btn");
    if (b) b.onclick = showQuiz;
  }

  function showQuiz() {
    var quiz = DATA.quiz;
    if (!quiz) return;
    $("detail").innerHTML = "<h2>" + quiz.q + "</h2>";
    (quiz.options || []).forEach(function (opt) {
      var btn = document.createElement("button");
      btn.className = "choice"; btn.type = "button"; btn.textContent = opt.t;
      btn.onclick = function () {
        report(!!opt.ok, quiz.q, opt.t);
        toast(opt.ok ? (quiz.ok || "正确") : (opt.why || "再调一调参数看看"), !opt.ok);
        if (opt.ok) $("detail").innerHTML += "<p class='hint'>" + (quiz.explain || "") + "</p>";
      };
      $("detail").appendChild(btn);
    });
  }

  function ctrl(id) {
    var list = DATA.controls || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return Number(S[id]);
    return 0;
  }
  function tog(id) { return !!S["tog_" + id]; }
  function ctrlMeta(id) {
    var list = DATA.controls || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function setCtrl(id, val) {
    var c = ctrlMeta(id);
    if (!c) return;
    val = clamp(val, Number(c.min), Number(c.max));
    S[id] = val;
    var inp = $("c-" + id);
    if (inp) inp.value = String(val);
    var lab = $("lab-" + id);
    if (lab) lab.textContent = fmt(val, Number(c.step) < 1 ? 1 : 0) + (c.unit || "");
  }

  function renderDock() {
    var dock = $("dock");
    var html = '<div class="sliders">';
    (DATA.controls || []).forEach(function (c) {
      html += '<div class="slider"><label><span>' + c.label + '</span><span id="lab-' + c.id + '">' +
        c.value + (c.unit || "") + "</span></label>" +
        '<input id="c-' + c.id + '" type="range" min="' + c.min + '" max="' + c.max +
        '" step="' + (c.step || 1) + '" value="' + c.value + '"></div>';
    });
    html += '</div><div class="toggles">';
    (DATA.toggles || []).forEach(function (t) {
      html += '<label><input id="t-' + t.id + '" type="checkbox"' + (t.on ? " checked" : "") + "> " + t.label + "</label>";
    });
    html += "</div>";
    if (DATA.needPlay !== false) html += '<button class="btn ghost" id="btn-play" type="button">暂停</button>';
    html += '<button class="btn reset" id="btn-reset" type="button">全部重置</button>';
    dock.innerHTML = html;
    (DATA.controls || []).forEach(function (c) {
      S[c.id] = c.value;
      $("c-" + c.id).oninput = function () {
        S[c.id] = Number(this.value);
        $("lab-" + c.id).textContent = fmt(S[c.id], c.step < 1 ? 1 : 0) + (c.unit || "");
        if (engine.onChange) engine.onChange();
        engine.draw();
      };
    });
    (DATA.toggles || []).forEach(function (t) {
      S["tog_" + t.id] = !!t.on;
      $("t-" + t.id).onchange = function () {
        S["tog_" + t.id] = this.checked;
        engine.draw();
      };
    });
    if ($("btn-play")) $("btn-play").onclick = function () {
      playing = !playing;
      this.textContent = playing ? "暂停" : "播放";
    };
    $("btn-reset").onclick = function () { resetAll(); };
  }

  function resetAll() {
    (DATA.controls || []).forEach(function (c) {
      S[c.id] = c.value;
      var inp = $("c-" + c.id);
      if (inp) inp.value = c.value;
      var lab = $("lab-" + c.id);
      if (lab) lab.textContent = c.value + (c.unit || "");
    });
    (DATA.toggles || []).forEach(function (t) {
      S["tog_" + t.id] = !!t.on;
      var inp = $("t-" + t.id);
      if (inp) inp.checked = !!t.on;
    });
    simT = 0; S.t = 0;
    if (engine.reset) engine.reset();
    engine.draw();
    toast("已重置", false);
  }

  function startDrag(hit, ev) {
    drag = hit;
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) return;
    var p = pt(ev);
    if (engine.drag) engine.drag(drag, p.x, p.y);
    engine.draw();
  }
  function onUp() {
    drag = null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  }

  /* ── engines ─────────────────────────────────────────── */
  var engine = { draw: function () {}, reset: function () {}, step: function () {}, hit: function () { return null; } };

  function magnetSim() {
    S.cx = 520; S.cy = 340;
    return {
      reset: function () { S.cx = 520; S.cy = 340; },
      hit: function (p) {
        if (Math.hypot(p.x - S.cx, p.y - S.cy) < 46) return "compass";
        return null;
      },
      drag: function (id, x, y) {
        if (id === "compass") { S.cx = clamp(x, 80, 820); S.cy = clamp(y, 70, 500); }
      },
      field: function (x, y) {
        var mx = 360, my = 250, half = 70;
        var nx = mx - half, ny = my, sx = mx + half, sy = my;
        function pole(px, py, sign) {
          var dx = x - px, dy = y - py, r2 = dx * dx + dy * dy + 90;
          var r3 = Math.pow(r2, 1.5);
          return { x: sign * dx / r3, y: sign * dy / r3 };
        }
        var n = pole(nx, ny, 1), s = pole(sx, sy, -1);
        return { x: n.x + s.x, y: n.y + s.y };
      },
      draw: function () {
        clear(svg);
        svg.appendChild(el("rect", { width: 900, height: 560, fill: "transparent" }));
        if (S["tog_lines"] !== false) {
          var g = el("g", { fill: "none", stroke: "#7b8a99", "stroke-width": "1.6", opacity: ".85" });
          for (var a = 0; a < 12; a++) {
            var ang = (a / 12) * Math.PI * 2;
            var x = 360 - 70 + Math.cos(ang) * 8, y = 250 + Math.sin(ang) * 8;
            var d = "M" + x + "," + y;
            for (var s = 0; s < 28; s++) {
              var B = this.field(x, y);
              var m = Math.hypot(B.x, B.y) || 1;
              x += 14 * B.x / m; y += 14 * B.y / m;
              d += " L" + x + "," + y;
            }
            g.appendChild(el("path", { d: d }));
          }
          svg.appendChild(g);
        }
        svg.appendChild(el("rect", { x: 290, y: 215, width: 70, height: 70, rx: 8, fill: "#e11d48" }));
        svg.appendChild(el("rect", { x: 360, y: 215, width: 70, height: 70, rx: 8, fill: "#2563eb" }));
        svg.appendChild(el("text", { x: 325, y: 258, "text-anchor": "middle", fill: "#fff", "font-size": "28", "font-weight": "800" }, "N"));
        svg.appendChild(el("text", { x: 395, y: 258, "text-anchor": "middle", fill: "#fff", "font-size": "28", "font-weight": "800" }, "S"));
        var B = this.field(S.cx, S.cy);
        var ang = Math.atan2(B.y, B.x) * 180 / Math.PI;
        var g2 = el("g", { transform: "translate(" + S.cx + "," + S.cy + ")" });
        g2.appendChild(el("circle", { r: 38, fill: "#fff", stroke: "#1e293b", "stroke-width": "3" }));
        var needle = el("g", { transform: "rotate(" + ang + ")" });
        needle.appendChild(el("polygon", { points: "18,0 -18,-7 -10,0 -18,7", fill: "#e11d48" }));
        needle.appendChild(el("polygon", { points: "-18,0 18,-7 10,0 18,7", fill: "#0f172a" }));
        g2.appendChild(needle);
        g2.appendChild(el("text", { y: 54, "text-anchor": "middle", "font-size": "12" }, "拖动小磁针"));
        svg.appendChild(g2);
        var mag = Math.hypot(B.x, B.y);
        setMeters([
          { k: "磁场方向", v: Math.round(ang) + "°" },
          { k: "相对强弱", v: fmt(mag * 8000, 2) }
        ]);
      }
    };
  }

  function faradaySim() {
    S.mx = 180; S.my = 250; S.emf = 0; S.prevFlux = 0;
    return {
      reset: function () { S.mx = 180; S.my = 250; S.emf = 0; S.prevFlux = 0; },
      hit: function (p) { return (p.x > S.mx - 90 && p.x < S.mx + 90 && p.y > S.my - 50 && p.y < S.my + 50) ? "mag" : null; },
      drag: function (id, x, y) {
        if (id === "mag") { S.mx = clamp(x, 90, 780); S.my = clamp(y, 140, 400); }
      },
      flux: function () {
        var coilX = 520, overlap = 1 - clamp(Math.abs(S.mx - coilX) / 220, 0, 1);
        return overlap * (1 - clamp(Math.abs(S.my - 250) / 160, 0, 1));
      },
      step: function (dt) {
        var fl = this.flux();
        var d = fl - (S.prevFlux || fl);
        S.emf = S.emf * 0.86 + d * 90;
        S.prevFlux = fl;
      },
      draw: function () {
        clear(svg);
        svg.appendChild(el("rect", { x: 430, y: 140, width: 180, height: 220, rx: 18, fill: "none", stroke: "#334155", "stroke-width": "10" }));
        for (var i = 0; i < 6; i++) {
          svg.appendChild(el("ellipse", { cx: 520, cy: 165 + i * 34, rx: 78, ry: 16, fill: "none", stroke: "#64748b", "stroke-width": "3" }));
        }
        svg.appendChild(el("circle", { cx: 740, cy: 250, r: 48, fill: "#fff", stroke: "#111", "stroke-width": "4" }));
        var ang = clamp(S.emf * 40, -55, 55);
        var needle = el("g", { transform: "translate(740,250) rotate(" + ang + ")" });
        needle.appendChild(el("line", { x1: 0, y1: 0, x2: 0, y2: -36, stroke: "#e11d48", "stroke-width": "3" }));
        svg.appendChild(needle);
        svg.appendChild(el("text", { x: 740, y: 312, "text-anchor": "middle", "font-size": "12" }, "电流计 G"));
        svg.appendChild(el("rect", { x: S.mx - 80, y: S.my - 32, width: 80, height: 64, rx: 6, fill: "#e11d48" }));
        svg.appendChild(el("rect", { x: S.mx, y: S.my - 32, width: 80, height: 64, rx: 6, fill: "#2563eb" }));
        svg.appendChild(el("text", { x: S.mx - 40, y: S.my + 8, "text-anchor": "middle", fill: "#fff", "font-size": "22", "font-weight": "800" }, "N"));
        svg.appendChild(el("text", { x: S.mx + 40, y: S.my + 8, "text-anchor": "middle", fill: "#fff", "font-size": "22", "font-weight": "800" }, "S"));
        svg.appendChild(el("text", { x: S.mx, y: S.my + 52, "text-anchor": "middle", "font-size": "12" }, "拖动磁铁进出线圈"));
        var emfAbs = Math.abs(S.emf);
        setMeters([
          { k: "相对磁通量", v: fmt(this.flux(), 2) },
          { k: "感应电动势", v: (S.emf >= 0 ? "+" : "−") + fmt(emfAbs, 2) },
          { k: "电流", v: emfAbs < 0.04 ? "≈ 0" : (S.emf > 0 ? "正偏" : "反偏") }
        ]);
      }
    };
  }

  function ohmSim() {
    return {
      draw: function () {
        var U = ctrl("U") || 6, R = Math.max(ctrl("R") || 6, 0.5), I = U / R;
        clear(svg);
        var battH = 36 + U * 6;
        svg.appendChild(el("rect", { x: 120, y: 280 - battH / 2, width: 54, height: battH, rx: 6, fill: "#f59e0b", stroke: "#b45309", "stroke-width": "3" }));
        svg.appendChild(el("text", { x: 147, y: 286, "text-anchor": "middle", "font-size": "14", "font-weight": "800" }, fmt(U, 1) + "V"));
        var zig = 8 + Math.round(R / 2);
        var d = "M240 250";
        for (var i = 0; i < zig; i++) d += " l12," + (i % 2 ? -22 : 22);
        d += " L560 250";
        svg.appendChild(el("path", { d: d, fill: "none", stroke: "#334155", "stroke-width": "4" }));
        svg.appendChild(el("text", { x: 400, y: 214, "text-anchor": "middle", "font-size": "14" }, "R = " + fmt(R, 1) + " Ω"));
        svg.appendChild(el("circle", { cx: 620, cy: 250, r: 26, fill: "#fff", stroke: "#111", "stroke-width": "3" }));
        svg.appendChild(el("text", { x: 620, y: 256, "text-anchor": "middle", "font-size": "14" }, "A"));
        svg.appendChild(el("line", { x1: 147, y1: 280 + battH / 2, x2: 147, y2: 360, stroke: "#111", "stroke-width": "4" }));
        svg.appendChild(el("line", { x1: 147, y1: 360, x2: 620, y2: 360, stroke: "#111", "stroke-width": "4" }));
        svg.appendChild(el("line", { x1: 620, y1: 360, x2: 620, y2: 276, stroke: "#111", "stroke-width": "4" }));
        svg.appendChild(el("line", { x1: 174, y1: 250, x2: 240, y2: 250, stroke: "#111", "stroke-width": "4" }));
        svg.appendChild(el("line", { x1: 560, y1: 250, x2: 594, y2: 250, stroke: "#111", "stroke-width": "4" }));
        var speed = clamp(I / 4, 0.15, 2.4);
        if (S["tog_electrons"] !== false && I > 0.02) {
          var t = ((S.t || 0) / 1000) * speed * 80;
          for (var k = 0; k < 12; k++) {
            var u = ((k / 12) + (t % 400) / 400) % 1;
            var x, y;
            if (u < 0.45) { x = 174 + u / 0.45 * 446; y = 250; }
            else if (u < 0.55) { x = 620; y = 250 + (u - 0.45) / 0.1 * 110; }
            else if (u < 0.95) { x = 620 - (u - 0.55) / 0.4 * 473; y = 360; }
            else { x = 147; y = 360 - (u - 0.95) / 0.05 * 80; }
            svg.appendChild(el("circle", { cx: x, cy: y, r: 5, fill: "#38bdf8" }));
          }
        }
        var fs = 18 + I * 4;
        svg.appendChild(el("text", { x: 400, y: 120, "text-anchor": "middle", "font-size": fs, fill: "#0171c3", "font-weight": "800" }, "I = U / R"));
        setMeters([
          { k: "电压 U", v: fmt(U, 1) + " V" },
          { k: "电阻 R", v: fmt(R, 1) + " Ω" },
          { k: "电流 I", v: fmt(I, 2) + " A" }
        ]);
      }
    };
  }

  function circuitSim() {
    S.openA = false; S.openB = false;
    return {
      reset: function () { S.openA = false; S.openB = false; },
      click: function (p) {
        var parallel = tog("parallel");
        if (Math.hypot(p.x - 200, p.y - 244) < 40) { S.openA = !S.openA; return true; }
        if (parallel && Math.hypot(p.x - 430, p.y - 180) < 40) { S.openB = !S.openB; return true; }
        return false;
      },
      hit: function () { return null; },
      drag: function () {},
      draw: function () {
        var parallel = tog("parallel");
        clear(svg);
        function wire(x1, y1, x2, y2) {
          svg.appendChild(el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: "#111", "stroke-width": "4" }));
        }
        function bulb(x, y, on) {
          svg.appendChild(el("circle", { cx: x, cy: y, r: 22, fill: on ? "#fde68a" : "#e2e8f0", stroke: "#334155", "stroke-width": "3" }));
          svg.appendChild(el("line", { x1: x - 8, y1: y - 8, x2: x + 8, y2: y + 8, stroke: "#334155", "stroke-width": "2" }));
        }
        function sw(x, y, open, label) {
          svg.appendChild(el("circle", { cx: x, cy: y, r: 7, fill: "#fff", stroke: "#111", "stroke-width": "2" }));
          svg.appendChild(el("line", { x1: x, y1: y, x2: x + (open ? 28 : 34), y2: y - (open ? 22 : 0), stroke: "#111", "stroke-width": "3" }));
          svg.appendChild(el("text", { x: x + 8, y: y + 28, "font-size": "12" }, label));
        }
        svg.appendChild(el("rect", { x: 80, y: 230, width: 50, height: 28, rx: 4, fill: "#f59e0b", stroke: "#b45309" }));
        var aOn, bOn, I;
        if (!parallel) {
          wire(130, 244, 200, 244); sw(200, 244, S.openA, "开关");
          wire(S.openA ? 200 : 234, 244, 320, 244); bulb(360, 244, !S.openA);
          wire(382, 244, 500, 244); bulb(540, 244, !S.openA);
          wire(562, 244, 720, 244); wire(720, 244, 720, 360); wire(80, 258, 80, 360); wire(80, 360, 720, 360);
          aOn = bOn = !S.openA; I = aOn ? 1 : 0;
        } else {
          wire(130, 244, 200, 244); sw(200, 244, S.openA, "干路");
          wire(S.openA ? 200 : 234, 244, 360, 244); wire(360, 180, 360, 310);
          sw(430, 180, S.openB, "支路");
          wire(S.openB ? 430 : 464, 180, 540, 180); bulb(580, 180, !S.openA && !S.openB);
          wire(602, 180, 720, 180);
          wire(360, 310, 540, 310); bulb(580, 310, !S.openA);
          wire(602, 310, 720, 310); wire(720, 180, 720, 360);
          wire(80, 258, 80, 360); wire(80, 360, 720, 360);
          aOn = !S.openA && !S.openB; bOn = !S.openA; I = (aOn ? 1 : 0) + (bOn ? 1 : 0);
        }
        svg.appendChild(el("text", { x: 400, y: 80, "text-anchor": "middle", "font-size": "16", "font-weight": "800", fill: "#0171c3" },
          parallel ? "并联：支路互不影响" : "串联：一处断开全灭"));
        svg.appendChild(el("text", { x: 400, y: 430, "text-anchor": "middle", "font-size": "12", fill: "#475569" }, "点击开关试试"));
        setMeters([
          { k: "接法", v: parallel ? "并联" : "串联" },
          { k: "L1", v: aOn ? "亮" : "灭" },
          { k: "L2", v: bOn ? "亮" : "灭" }
        ]);
      }
    };
  }

  function forceSim() {
    S.a1 = 40; S.a2 = 0;
    return {
      reset: function () { S.a1 = 40; S.a2 = 0; },
      hit: function (p) {
        var o = { x: 280, y: 340 };
        var p1 = { x: o.x + Math.cos(S.a1 * Math.PI / 180) * (ctrl("F1") || 8) * 18, y: o.y - Math.sin(S.a1 * Math.PI / 180) * (ctrl("F1") || 8) * 18 };
        var p2 = { x: o.x + Math.cos(S.a2 * Math.PI / 180) * (ctrl("F2") || 6) * 18, y: o.y - Math.sin(S.a2 * Math.PI / 180) * (ctrl("F2") || 6) * 18 };
        if (Math.hypot(p.x - p1.x, p.y - p1.y) < 28) return "a1";
        if (Math.hypot(p.x - p2.x, p.y - p2.y) < 28) return "a2";
        return null;
      },
      drag: function (id, x, y) {
        var ang = Math.atan2(340 - y, x - 280) * 180 / Math.PI;
        if (id === "a1") S.a1 = ang;
        if (id === "a2") S.a2 = ang;
      },
      onChange: function () {},
      draw: function () {
        var F1 = ctrl("F1") || 8, F2 = ctrl("F2") || 6;
        var o = { x: 280, y: 340 };
        function vec(ang, mag) {
          return { x: o.x + Math.cos(ang * Math.PI / 180) * mag * 18, y: o.y - Math.sin(ang * Math.PI / 180) * mag * 18 };
        }
        var p1 = vec(S.a1, F1), p2 = vec(S.a2, F2);
        var rx = (p1.x - o.x) + (p2.x - o.x), ry = (p1.y - o.y) + (p2.y - o.y);
        var pr = { x: o.x + rx, y: o.y + ry };
        var F = Math.hypot(F1 * Math.cos(S.a1 * Math.PI / 180) + F2 * Math.cos(S.a2 * Math.PI / 180),
          F1 * Math.sin(S.a1 * Math.PI / 180) + F2 * Math.sin(S.a2 * Math.PI / 180));
        clear(svg);
        function arrow(a, b, color, label) {
          svg.appendChild(el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: color, "stroke-width": "7", "stroke-linecap": "round" }));
          svg.appendChild(el("circle", { cx: b.x, cy: b.y, r: 8, fill: color }));
          svg.appendChild(el("text", { x: (a.x + b.x) / 2 + 8, y: (a.y + b.y) / 2 - 8, fill: color, "font-size": "16", "font-weight": "800" }, label));
        }
        svg.appendChild(el("line", { x1: p1.x, y1: p1.y, x2: pr.x, y2: pr.y, stroke: "#94a3b8", "stroke-dasharray": "6 5", "stroke-width": "2" }));
        svg.appendChild(el("line", { x1: p2.x, y1: p2.y, x2: pr.x, y2: pr.y, stroke: "#94a3b8", "stroke-dasharray": "6 5", "stroke-width": "2" }));
        arrow(o, p1, "#e11d48", "F₁");
        arrow(o, p2, "#2563eb", "F₂");
        arrow(o, pr, "#15803d", "F");
        svg.appendChild(el("circle", { cx: o.x, cy: o.y, r: 7, fill: "#111" }));
        svg.appendChild(el("text", { x: 450, y: 80, "font-size": "14" }, "拖动箭头末端改变方向"));
        setMeters([
          { k: "F₁", v: fmt(F1, 1) + " N" },
          { k: "F₂", v: fmt(F2, 1) + " N" },
          { k: "合力 F", v: fmt(F, 1) + " N" }
        ]);
      }
    };
  }

  function newtonSim() {
    S.x = 120; S.v = 0;
    return {
      reset: function () { S.x = 120; S.v = 0; },
      step: function (dt) {
        var F = ctrl("F") || 0, m = Math.max(ctrl("m") || 2, 0.4);
        var mu = tog("friction") ? 0.25 : 0;
        var g = 10, N = m * g, ff = mu * N;
        var a;
        if (Math.abs(S.v) < 0.02 && Math.abs(F) <= ff) { S.v = 0; a = 0; }
        else a = (F - ff * (S.v >= 0 ? 1 : -1)) / m;
        S.v += a * dt * 0.06;
        S.x += S.v * dt * 0.06;
        if (S.x < 80) { S.x = 80; S.v = 0; }
        if (S.x > 760) { S.x = 760; S.v = 0; }
        this._a = a; this._ff = ff;
      },
      draw: function () {
        var F = ctrl("F") || 0, m = ctrl("m") || 2;
        clear(svg);
        svg.appendChild(el("line", { x1: 60, y1: 340, x2: 840, y2: 340, stroke: "#64748b", "stroke-width": "8" }));
        svg.appendChild(el("rect", { x: S.x - 50, y: 270, width: 100, height: 64, rx: 10, fill: "#fdba74", stroke: "#c2410c", "stroke-width": "3" }));
        svg.appendChild(el("text", { x: S.x, y: 308, "text-anchor": "middle", "font-size": "14", "font-weight": "800" }, fmt(m, 1) + " kg"));
        if (F) {
          var dir = F >= 0 ? 1 : -1;
          svg.appendChild(el("line", { x1: S.x, y1: 250, x2: S.x + dir * (40 + Math.abs(F) * 8), y2: 250, stroke: "#e11d48", "stroke-width": "5" }));
        }
        setMeters([
          { k: "合力相关 a", v: fmt(this._a || 0, 2) + " m/s²" },
          { k: "速度 v", v: fmt(S.v, 2) + " m/s" },
          { k: "摩擦力", v: tog("friction") ? fmt(this._ff || 0, 1) + " N" : "0" }
        ]);
      }
    };
  }

  function statesSim() {
    S.parts = [];
    function seed() {
      S.parts = [];
      for (var i = 0; i < 36; i++) S.parts.push({ x: 300 + (i % 6) * 40, y: 160 + Math.floor(i / 6) * 40, vx: 0, vy: 0 });
    }
    seed();
    return {
      reset: seed,
      step: function (dt) {
        var T = ctrl("T") || 20;
        var jig = T < 0 ? 0.15 : T < 100 ? 0.7 + T / 80 : 2.2;
        S.parts.forEach(function (p, i) {
          if (T < 0) {
            p.x = lerp(p.x, 300 + (i % 6) * 40, 0.08);
            p.y = lerp(p.y, 160 + Math.floor(i / 6) * 40, 0.08);
            p.x += (Math.random() - 0.5) * jig; p.y += (Math.random() - 0.5) * jig;
          } else if (T < 100) {
            p.vx += (Math.random() - 0.5) * 0.4; p.vy += (Math.random() - 0.5) * 0.4;
            p.vx *= 0.9; p.vy *= 0.9;
            p.x = clamp(p.x + p.vx * jig, 260, 560);
            p.y = clamp(p.y + p.vy * jig, 140, 400);
          } else {
            p.vx += (Math.random() - 0.5) * 1.2; p.vy += (Math.random() - 0.5) * 1.2;
            p.x = (p.x + p.vx + 900) % 900; p.y = (p.y + p.vy + 560) % 560;
          }
        });
      },
      draw: function () {
        var T = ctrl("T") || 20;
        var phase = T < 0 ? "固态（振动）" : T < 100 ? "液态（流动）" : "气态（飞散）";
        clear(svg);
        svg.appendChild(el("rect", { x: 240, y: 120, width: 340, height: 300, rx: 16, fill: "#e0f2fe", stroke: "#0369a1", "stroke-width": "4" }));
        S.parts.forEach(function (p) {
          svg.appendChild(el("circle", { cx: p.x, cy: p.y, r: 8, fill: T < 0 ? "#0369a1" : T < 100 ? "#0ea5e9" : "#7dd3fc", stroke: "#0f172a" }));
        });
        setMeters([{ k: "温度", v: fmt(T, 0) + " ℃" }, { k: "物态", v: phase }]);
      }
    };
  }

  function reflectSim() {
    S.i = 40;
    return {
      reset: function () { S.i = 40; },
      hit: function (p) {
        var ix = 360 - Math.sin(S.i * Math.PI / 180) * 220;
        var iy = 360 - Math.cos(S.i * Math.PI / 180) * 220;
        return Math.hypot(p.x - ix, p.y - iy) < 36 ? "ray" : null;
      },
      drag: function (id, x, y) {
        var ang = Math.atan2(360 - x, 360 - y) * 180 / Math.PI;
        S.i = clamp(ang, 5, 80);
        setCtrl("i", S.i);
      },
      onChange: function () { S.i = ctrl("i") || S.i; },
      draw: function () {
        var i = S.i, r = i;
        clear(svg);
        svg.appendChild(el("line", { x1: 80, y1: 360, x2: 640, y2: 360, stroke: "#334155", "stroke-width": "8" }));
        svg.appendChild(el("line", { x1: 360, y1: 80, x2: 360, y2: 360, stroke: "#64748b", "stroke-dasharray": "8 6", "stroke-width": "2" }));
        var ix = 360 - Math.sin(i * Math.PI / 180) * 240, iy = 360 - Math.cos(i * Math.PI / 180) * 240;
        var rx = 360 + Math.sin(r * Math.PI / 180) * 240, ry = 360 - Math.cos(r * Math.PI / 180) * 240;
        svg.appendChild(el("line", { x1: ix, y1: iy, x2: 360, y2: 360, stroke: "#ea580c", "stroke-width": "5" }));
        svg.appendChild(el("circle", { cx: ix, cy: iy, r: 10, fill: "#ea580c" }));
        svg.appendChild(el("line", { x1: 360, y1: 360, x2: rx, y2: ry, stroke: "#2563eb", "stroke-width": "5" }));
        svg.appendChild(el("text", { x: 200, y: 140, fill: "#c2410c", "font-size": "14" }, "入射 i=" + Math.round(i) + "°"));
        svg.appendChild(el("text", { x: 500, y: 140, fill: "#1d4ed8", "font-size": "14" }, "反射 r=" + Math.round(r) + "°"));
        svg.appendChild(el("text", { x: 360, y: 420, "text-anchor": "middle", "font-size": "13" }, "拖动橙色端点 · 角从法线量起"));
        setMeters([{ k: "入射角 i", v: Math.round(i) + "°" }, { k: "反射角 r", v: Math.round(r) + "°" }]);
      }
    };
  }

  function lensSim() {
    S.u = 280;
    return {
      reset: function () { S.u = 280; },
      hit: function (p) { return (p.x > 360 - S.u - 30 && p.x < 360 - S.u + 30 && p.y > 160 && p.y < 260) ? "obj" : null; },
      drag: function (id, x) {
        if (id === "obj") {
          S.u = clamp(360 - x, 40, 330);
          setCtrl("u", S.u);
        }
      },
      onChange: function () { S.u = ctrl("u") || S.u; },
      draw: function () {
        var f = 90, u = S.u, h = 70;
        var inv = 1 / f - 1 / u, v = inv !== 0 ? 1 / inv : 8000;
        var m = -v / u, hi = h * m;
        clear(svg);
        svg.appendChild(el("line", { x1: 40, y1: 250, x2: 860, y2: 250, stroke: "#cbd5e1" }));
        svg.appendChild(el("ellipse", { cx: 360, cy: 250, rx: 16, ry: 110, fill: "#e0f2fe", stroke: "#0369a1", "stroke-width": "3" }));
        [[360 - 2 * f, "2f"], [360 - f, "f"], [360 + f, "f"], [360 + 2 * f, "2f"]].forEach(function (m2) {
          svg.appendChild(el("circle", { cx: m2[0], cy: 250, r: 4, fill: "#111" }));
          svg.appendChild(el("text", { x: m2[0], y: 272, "text-anchor": "middle", "font-size": "11" }, m2[1]));
        });
        var ox = 360 - u;
        svg.appendChild(el("polygon", { points: ox + ",250 " + ox + "," + (250 - h) + " " + (ox + 16) + ",250", fill: "#ea580c" }));
        svg.appendChild(el("text", { x: ox, y: 250 - h - 8, "text-anchor": "middle", "font-size": "12" }, "物"));
        svg.appendChild(el("line", { x1: ox, y1: 250 - h, x2: 360, y2: 250 - h, stroke: "#ea580c", "stroke-width": "2" }));
        svg.appendChild(el("line", { x1: 360, y1: 250 - h, x2: 360 + v, y2: 250 - hi, stroke: "#1d4ed8", "stroke-width": "2" }));
        svg.appendChild(el("line", { x1: ox, y1: 250 - h, x2: 360, y2: 250, stroke: "#ea580c", "stroke-width": "2" }));
        svg.appendChild(el("line", { x1: 360, y1: 250, x2: 360 + v, y2: 250 - hi, stroke: "#1d4ed8", "stroke-width": "2" }));
        if (v > 0) svg.appendChild(el("polygon", { points: (360 + v) + ",250 " + (360 + v) + "," + (250 - hi) + " " + (360 + v - 14) + ",250", fill: "#1d4ed8" }));
        else svg.appendChild(el("polygon", { points: (360 + v) + ",250 " + (360 + v) + "," + (250 - hi) + " " + (360 + v + 14) + ",250", fill: "none", stroke: "#1d4ed8", "stroke-dasharray": "5 4" }));
        var kind = u > 2 * f + 4 ? "倒立缩小实像 · 照相机" : u > f + 4 ? "倒立放大实像 · 投影仪" : Math.abs(u - f) <= 4 ? "不成像" : "正立放大虚像 · 放大镜";
        setMeters([
          { k: "物距 u", v: fmt(u, 0) },
          { k: "像距 v", v: Math.abs(v) > 2000 ? "∞" : fmt(v, 0) },
          { k: "成像", v: kind }
        ]);
      }
    };
  }

  function buoyancySim() {
    S.y = 220; S.vy = 0;
    return {
      reset: function () { S.y = 220; S.vy = 0; },
      step: function (dt) {
        var ro = ctrl("rho") || 0.6, rl = Math.max(ctrl("liquid") || 1, 0.2);
        var g = 10, V = 1, waterY = 260, boxH = 70;
        var bottom = S.y + boxH;
        var sub = clamp((bottom - waterY) / boxH, 0, 1);
        var Fb = rl * g * V * sub, G = ro * g * V;
        var a = (G - Fb);
        S.vy = (S.vy || 0) + a * dt * 0.012;
        S.vy *= 0.9;
        S.y += S.vy;
        S.y = clamp(S.y, 90, 390);
        if (S.y <= 90 || S.y >= 390) S.vy = 0;
        this._Fb = Fb; this._G = G; this._sub = sub;
      },
      draw: function () {
        clear(svg);
        svg.appendChild(el("rect", { x: 220, y: 120, width: 360, height: 300, fill: "none", stroke: "#0369a1", "stroke-width": "6" }));
        svg.appendChild(el("rect", { x: 226, y: 260, width: 348, height: 154, fill: "#7dd3fc", opacity: ".7" }));
        svg.appendChild(el("rect", { x: 340, y: S.y, width: 120, height: 70, rx: 8, fill: "#fdba74", stroke: "#c2410c", "stroke-width": "3" }));
        svg.appendChild(el("line", { x1: 400, y1: S.y, x2: 400, y2: S.y - 50, stroke: "#15803d", "stroke-width": "5" }));
        svg.appendChild(el("line", { x1: 400, y1: S.y + 70, x2: 400, y2: S.y + 120, stroke: "#b91c1c", "stroke-width": "5" }));
        var st = (this._Fb || 0) > (this._G || 0) + 0.05 ? "上浮" : (this._Fb || 0) < (this._G || 0) - 0.05 ? "下沉" : "漂浮/悬浮";
        setMeters([
          { k: "F浮", v: fmt(this._Fb || 0, 2) },
          { k: "G", v: fmt(this._G || 0, 2) },
          { k: "状态", v: st }
        ]);
      }
    };
  }

  var ENGINES = {
    magnet: magnetSim, faraday: faradaySim, ohm: ohmSim, circuit: circuitSim,
    forces: forceSim, newton: newtonSim, states: statesSim, reflect: reflectSim,
    lens: lensSim, buoyancy: buoyancySim
  };

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(32, ts - lastTs);
    lastTs = ts;
    if (playing) {
      simT += dt;
      S.t = simT;
      if (engine.step) engine.step(dt);
    }
    engine.draw();
    requestAnimationFrame(tick);
  }

  function init() {
    $("badge").textContent = DATA.badge || "物理探究";
    $("title").textContent = DATA.title || "物理探究";
    $("subtitle").textContent = DATA.subtitle || "";
    $("equation").textContent = DATA.equation || "";
    $("equation").style.display = DATA.equation ? "" : "none";
    svg = el("svg", { viewBox: "0 0 900 560", xmlns: NS });
    $("view").innerHTML = "";
    $("view").appendChild(svg);
    var make = ENGINES[DATA.sim] || magnetSim;
    engine = make();
    renderDock();
    showIntro();
    svg.style.touchAction = "none";
    svg.addEventListener("pointerdown", function (ev) {
      var p = pt(ev);
      if (engine.click && engine.click(p)) { engine.draw(); return; }
      var hit = engine.hit && engine.hit(p);
      if (hit) startDrag(hit, ev);
    });
    engine.draw();
    requestAnimationFrame(tick);
  }

  init();
})();
</script>
