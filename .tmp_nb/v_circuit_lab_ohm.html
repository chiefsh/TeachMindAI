  <script>/* 电学实验台：器材库 → 实验台自由摆放，从接线柱拉导线，节点电压法实时求解。 */

  /* ── 求解：节点电压法（含灯丝电阻随温度迭代） ────────────── */
  function bulbRated(p) {

  function buildElements(hot) {

      } else if (p.type === "switch") {

  function solveLinear(A, b) {
    var n = b.length;

      if (best < 1e-18) continue;

    var x = new Array(n).fill(0);
    for (var i = n - 1; i >= 0; i--) {

    function pair(p, t1, t2) { var a = f(tkey(p.id, t1)), b = f(tkey(p.id, t2)); return a < b ? a + "|" + b : b + "|" + a; }

      case "lit":

        labels += txt(cx + Math.sin(a) * (R - 16), cy - Math.cos(a) * (R - 16) + 4, lv % 1 ? fmt(lv, lv < 1 ? 1 : 1) : String(lv), 8.5, "#33475e", 700);
      }
    }
    h += '<path d="' + ticks + '" stroke="#33475e" stroke-width="1.2"/>' + labels;
    h += txt(0, 2, letter, 13, "#1b2f4a", 800);
    var na = ang * Math.PI / 180;
    h += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.sin(na) * (R - 4)) + '" y2="' + (cy - Math.cos(na) * (R - 4)) + '" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>';
    h += '<circle cx="' + cx + '" cy="' + cy + '" r="3.5" fill="#1b2f4a"/>';
    h += '<rect x="-34" y="20" width="68" height="15" rx="4" fill="#0f2b1d"/>' + txt(0, 31.5, reading, 10.5, st && (st.over || st.rev) ? "#ffb4a2" : "#7dff9e", 700);
    ["n", "r1", "r2"].forEach(function (k) {
      var t = tl[k];
      h += txt(t[0], 70, t[2] === "-" ? "−" : t[2], 11, k === "n" ? "#1b2f4a" : "#d92d20", 800);
    });
    return h;
  }

  var DRAW = { battery: drawBattery, switch: drawSwitch, bulb: drawBulb, resistor: drawResistor, rheostat: drawRheostat, ammeter: drawMeter, voltmeter: drawMeter };

  function termColor(p, t) {
    var d = TYPES[p.type].terms[t];
    if (d[2] === "-") return "#1b1f24";
    if (d[2]) return "#c62828";
    return "#8f6a1b";
  }
  function drawTerms(p, schem, hotTerm) {
    var h = "";
    Object.keys(TYPES[p.type].terms).forEach(function (t) {
      var q = termPos(p, t);
      var k = tkey(p.id, t);
      h += '<circle class="term-hit" data-term="' + k + '" cx="' + q[0] + '" cy="' + q[1] + '" r="13" fill="transparent"/>';
      if (schem) h += '<circle class="term-ring' + (hotTerm === k ? " hot" : "") + '" cx="' + q[0] + '" cy="' + q[1] + '" r="4.5" fill="#fff" stroke="#1b2f4a" stroke-width="2" pointer-events="none"/>';
      else h += '<circle class="term-ring' + (hotTerm === k ? " hot" : "") + '" cx="' + q[0] + '" cy="' + q[1] + '" r="7" fill="url(#g-brass)" stroke="' + termColor(p, t) + '" stroke-width="3" pointer-events="none"/>' +
        '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="2.2" fill="#5a4310" pointer-events="none"/>';
    });
    return h;
  }

  function wirePath(w) {
    var pa = partById(w.a[0]), pb = partById(w.b[0]);
    if (!pa || !pb) return "";
    var A = termPos(pa, w.a[1]), B = termPos(pb, w.b[1]);
    return pathBetween(A, B, w.id);
  }
  function pathBetween(A, B, salt) {
    var dx = B[0] - A[0], dy = B[1] - A[1];
    if (mode === "schem") {
      if (Math.abs(dx) >= Math.abs(dy)) return "M" + A[0] + " " + A[1] + " H" + B[0] + " V" + B[1];
      return "M" + A[0] + " " + A[1] + " V" + B[1] + " H" + B[0];
    }
    var sag = Math.min(110, 26 + Math.abs(dx) * 0.18 + Math.abs(dy) * 0.08);
    return "M" + A[0] + " " + A[1] + " C" + (A[0] + dx * 0.2) + " " + (A[1] + sag) + " " + (B[0] - dx * 0.2) + " " + (B[1] + sag) + " " + B[0] + " " + B[1];
  }

  var wireDraft = null;
  var hotTerm = null;

  function render() {
    setViewBox();
    var schem = mode === "schem";
    var h = defs();
    h += '<rect x="-2000" y="-2000" width="5200" height="4720" fill="' + (schem ? "#fbfcfe" : "url(#grid5)") + '" data-bg="1"/>';
    h += '<g id="wires">';
    wires.forEach(function (w) {
      var d = wirePath(w);
      var on = sel && sel.kind === "wire" && sel.id === w.id;
      if (schem) {
        h += '<path d="' + d + '" fill="none" stroke="' + (on ? "#f59e0b" : "#1b2f4a") + '" stroke-width="' + (on ? 4 : 2.5) + '" stroke-linejoin="round"/>';
      } else {
        h += '<path d="' + d + '" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="7" transform="translate(0 3)"/>';
        if (on) h += '<path d="' + d + '" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity=".7"/>';
        h += '<path d="' + d + '" fill="none" stroke="' + w.c + '" stroke-width="4.5" stroke-linecap="round"/>';
        h += '<path d="' + d + '" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-linecap="round" transform="translate(0 -1)"/>';
      }
      h += '<path id="wp-' + w.id + '" d="' + d + '" fill="none" stroke="transparent" stroke-width="16" data-wire="' + w.id + '"/>';
    });
    h += "</g><g id=\"parts\">";
    parts.forEach(function (p) {
      var st = sol ? sol.parts[p.id] : null;
      h += '<g data-part="' + p.id + '" transform="translate(' + p.x + " " + p.y + ") rotate(" + p.rot + ')">' +
        '<rect x="' + (-TYPES[p.type].w / 2) + '" y="' + (-TYPES[p.type].h / 2) + '" width="' + TYPES[p.type].w + '" height="' + TYPES[p.type].h + '" fill="transparent"/>' +
        DRAW[p.type](p, st, schem) + "</g>";
    });
    h += "</g><g id=\"flow\"></g><g id=\"terms\">";
    parts.forEach(function (p) { h += drawTerms(p, schem, hotTerm); });

    if (sel && sel.kind === "part") {
      var p = partById(sel.id);
      if (p) {
        var b = partBox(p);
        h += '<rect x="' + (b.x - 8) + '" y="' + (b.y - 8) + '" width="' + (b.w + 16) + '" height="' + (b.h + 16) + '" rx="8" fill="none" stroke="#2f6fd6" stroke-width="1.6" stroke-dasharray="6 4" pointer-events="none"/>';
        h += '<g data-rot="1" transform="translate(' + (b.x - 8) + " " + (b.y - 22) + ')"><circle r="12" fill="#2f6fd6"/><path d="M-5 -1 a5.5 5.5 0 1 1 1.5 5" fill="none" stroke="#fff" stroke-width="2"/><path d="M-8 -3 l3 3 l3 -3" fill="none" stroke="#fff" stroke-width="2"/></g>';
        h += '<g data-del="1" transform="translate(' + (b.x + b.w + 8) + " " + (b.y - 22) + ')"><circle r="12" fill="#dc2626"/><path d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>';
      }
    }
    if (wireDraft) {
      h += '<path d="' + pathBetween(wireDraft.from, wireDraft.to) + '" fill="none" stroke="' + wireDraft.c + '" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round" pointer-events="none"/>';
    }
    svg.innerHTML = h;
    cachePaths();
  }

  /* ── 电流流动小点 ─────────────────────────────── */
  var pathCache = [];
  function cachePaths() {
    pathCache = [];
    if (!sol) return;
    wires.forEach(function (w) {
      var el = document.getElementById("wp-" + w.id);
      var I = sol.wires[w.id] || 0;
      if (!el || Math.abs(I) < 2e-3) return;
      var L = 0;
      try { L = el.getTotalLength(); } catch (e) {}
      if (L > 2) pathCache.push({ el: el, L: L, I: I });
    });
  }
  var phase = 0, lastTs = 0;
  function tick(ts) {
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    phase += dt;
    var g = document.getElementById("flow");
    if (g) {
      if (!showFlow || !pathCache.length) { if (g.firstChild) g.innerHTML = ""; }
      else {
        var h = "";
        pathCache.forEach(function (c) {
          var speed = clamp(Math.abs(c.I) * 160, 18, 240), gap = 30;
          var off = (phase * speed) % gap;
          for (var s = off; s < c.L; s += gap) {
            var d = c.I > 0 ? s : c.L - s;
            var pt = c.el.getPointAtLength(d);
            h += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="3" fill="#ffe066" stroke="#b45309" stroke-width="1"/>';
          }
        });
        g.innerHTML = h;
      }
    }
    requestAnimationFrame(tick);
  }

  /* ── 刷新：求解 → 判定 → 警示 → 绘制 ───────────────── */
  function refresh(quiet) {
    sol = solve();
    var burnt = burnCheck(sol);
    if (burnt.length) {
      sol = solve();
      lastSnap = snapshot();
      if (!quiet) toast("灯泡两端电压过高，灯丝烧断了！在属性里可以更换灯泡。", "bad");
    }
    updateWarnings(quiet);
    updateSteps(quiet);
    render();
    renderProps();
    renderTools();
    renderRecordBar();
  }

  function updateWarnings(quiet) {
    var now = {}, chips = [];
    parts.forEach(function (p) {
      var s = sol.parts[p.id];
      var T = TYPES[p.type];
      if (p.type === "battery" && s.short) { now["short" + p.id] = "电源短路！电流过大会损坏电源"; }
      if ((p.type === "ammeter" || p.type === "voltmeter") && s.connected) {
        if (s.over) now["over" + p.id] = T.name + "超量程，应换大量程";
        if (s.rev) now["rev" + p.id] = T.name + "正负接线柱接反了";
      }
      if (p.type === "bulb" && p.props.broken) now["burn" + p.id] = "灯泡已烧坏";
    });
    Object.keys(now).forEach(function (k) {
      chips.push("<span>" + esc(now[k]) + "</span>");
      if (!warnPrev[k] && !quiet) toast(now[k], "bad");
    });
    warnPrev = now;
    $("warn").innerHTML = chips.join("");
  }

  /* ── 实验指导面板 ─────────────────────────────── */
  var STEPS = DATA.steps || [];
  function updateSteps(quiet) {
    var changed = false;
    STEPS.forEach(function (s, i) {
      if (doneSteps[i]) return;
      if (s.check && evalCheck(s.check)) {
        doneSteps[i] = true;
        changed = true;
        if (!quiet) toast("✓ " + (s.ok || s.text), "ok");
      }
    });
    if (changed || quiet) renderSteps();
    var total = STEPS.filter(function (s) { return s.check; }).length;
    var done = STEPS.filter(function (s, i) { return s.check && doneSteps[i]; }).length;
    if (total && done === total && !allDoneReported) {
      allDoneReported = true;
      if (!quiet) setTimeout(function () { toast("实验步骤全部完成！", "ok"); }, 900);
      report(true, DATA.title || "电学实验", "完成全部实验步骤");
    }
  }

  function renderSteps() {
    var ul = $("steps-list");
    if (!ul) return;
    var firstOpen = -1;
    STEPS.forEach(function (s, i) { if (firstOpen < 0 && s.check && !doneSteps[i]) firstOpen = i; });
    ul.innerHTML = STEPS.map(function (s, i) {
      var cls = doneSteps[i] ? "done" : (i === firstOpen ? "now" : "");
      return '<li class="' + cls + '"><span class="dot">' + (doneSteps[i] ? "✓" : "") + "</span><span>" + esc(s.text) + "</span></li>";
    }).join("");
  }

  var REC = DATA.record || null;
  function recColumns() { return (REC && REC.columns) || ["U", "I", "R"]; }
  var COL_LABEL = { U: "U / V", I: "I / A", R: "R / Ω", P: "P / W" };

  function firstReading(type) {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.type !== type) continue;
      var s = sol && sol.parts[p.id];
      if (s && s.connected && !s.over && !s.rev) return s.val;
    }
    return null;
  }
  function recordNow() {
    var U = firstReading("voltmeter"), I = firstReading("ammeter");
    if (U == null || I == null) { toast("需要电压表和电流表都正确接入并有读数才能记录", "bad"); return; }
    if (I < 0.005) { toast("电流太小，先闭合开关", "bad"); return; }
    if (records.length >= 12) { toast("最多记录 12 组数据", "bad"); return; }
    var row = { U: +fmt(U, 2), I: +fmt(I, 2) };
    row.R = row.I ? +fmt(row.U / row.I, 1) : 0;
    row.P = +fmt(row.U * row.I, 3);
    records.push(row);
    toast("已记录第 " + records.length + " 组数据", "ok");
    refresh(true);
    try { window.NB && window.NB.changed && window.NB.changed(); } catch (e) {}
  }
  function renderRecordBar() {
    var box = $("rec-box");
    if (!box || !REC) return;
    var cols = recColumns();
    var h = '<table class="tbl"><tr><th>次数</th>' + cols.map(function (c) { return "<th>" + COL_LABEL[c] + "</th>"; }).join("") + "</tr>";
    if (!records.length) h += '<tr><td colspan="' + (cols.length + 1) + '" style="color:#8a99ab">闭合开关后点「记录数据」</td></tr>';
    records.forEach(function (r, i) {
      h += "<tr><td>" + (i + 1) + "</td>" + cols.map(function (c) { return "<td>" + r[c] + "</td>"; }).join("") + "</tr>";
    });
    h += "</table>";
    box.innerHTML = h;
    drawChart();
  }
  function drawChart() {
    var c = $("chart");
    if (!c || !REC || !REC.chart) return;
    var W = 252, H = 170, L = 34, B = 26, T = 10, Rr = 10;
    var pts = records.map(function (r) { return [r.U, r.I]; });
    var maxU = Math.max(1, Math.max.apply(null, pts.map(function (p) { return p[0]; }).concat([0])) * 1.2);
    var maxI = Math.max(0.1, Math.max.apply(null, pts.map(function (p) { return p[1]; }).concat([0])) * 1.2);
    function X(u) { return L + (W - L - Rr) * u / maxU; }
    function Y(i) { return H - B - (H - B - T) * i / maxI; }
    var h = '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - 4) + '" y2="' + (H - B) + '" stroke="#33475e"/>' +
      '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + L + '" y2="4" stroke="#33475e"/>';
    for (var k = 1; k <= 4; k++) {
      var u = maxU * k / 4, ii = maxI * k / 4;
      h += '<line x1="' + X(u) + '" y1="' + T + '" x2="' + X(u) + '" y2="' + (H - B) + '" stroke="#e6edf4"/>';
      h += '<line x1="' + L + '" y1="' + Y(ii) + '" x2="' + (W - Rr) + '" y2="' + Y(ii) + '" stroke="#e6edf4"/>';
      h += '<text x="' + X(u) + '" y="' + (H - B + 13) + '" font-size="9" text-anchor="middle" fill="#5e6f83">' + fmt(u, 1) + "</text>";
      h += '<text x="' + (L - 4) + '" y="' + (Y(ii) + 3) + '" font-size="9" text-anchor="end" fill="#5e6f83">' + fmt(ii, 2) + "</text>";
    }
    h += '<text x="' + (W - 6) + '" y="' + (H - 4) + '" font-size="10" text-anchor="end" fill="#33475e" font-weight="700">U/V</text>';
    h += '<text x="6" y="12" font-size="10" fill="#33475e" font-weight="700">I/A</text>';
    var sorted = pts.slice().sort(function (a, b) { return a[0] - b[0]; });
    if (REC.chart === "linear" && pts.length >= 2) {
      var sxy = 0, sxx = 0;
      pts.forEach(function (p) { sxy += p[0] * p[1]; sxx += p[0] * p[0]; });
      var k2 = sxx ? sxy / sxx : 0;
      h += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(maxU) + '" y2="' + Y(k2 * maxU) + '" stroke="#2f6fd6" stroke-width="1.6" stroke-dasharray="5 3"/>';
      if (k2) h += '<text x="' + (W - 14) + '" y="22" font-size="10" text-anchor="end" fill="#2f6fd6" font-weight="700">R ≈ ' + fmt(1 / k2, 1) + " Ω</text>";
    } else if (REC.chart === "curve" && sorted.length >= 2) {
      h += '<polyline points="' + [[0, 0]].concat(sorted).map(function (p) { return X(p[0]) + "," + Y(p[1]); }).join(" ") + '" fill="none" stroke="#2f6fd6" stroke-width="1.6"/>';
    }
    pts.forEach(function (p) { h += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="3.5" fill="#d92d20"/>'; });
    c.innerHTML = h;
  }

  function renderGuide() {
    var I = DATA.intro || {};

      };
    });
  }

  /* ── 属性面板 ─────────────────────────────── */
  function renderProps() {

        '<div class="pb"><div class="note">电流 ≈ ' + fmt(I, 2) + ' A</div><div class="acts">' +
        WIRE_COLORS.map(function (c) { return '<button type="button" class="mini" data-color="' + c + '" style="background:' + c + ';width:26px;height:22px;border-color:' + (w.c === c ? "#f59e0b" : "#fff") + '"></button>'; }).join("") +
        "</div></div>";

    Object.keys(T.props || {}).forEach(function (k) {

      } else if (d.kind === "bool") {

      h += '<div class="note">' + (st.connected ? "当前量程 0 ~ " + st.range + " " + T.unit + "，示数 " + fmt(st.val, 2) + " " + T.unit : "尚未接入电路") + "</div>";
    }
    if (T.note) h += '<div class="note">' + T.note + "</div>";
    h += "</div>";
    box.innerHTML = h;
    box.classList.add("show");
    $("pp-rot").onclick = function () { rotateSel(); };
    $("pp-del").onclick = deleteSel;
    if ($("pp-fix")) $("pp-fix").onclick = function () { p.props.broken = false; commit(); refresh(); };
    Array.prototype.forEach.call(box.querySelectorAll("[data-prop]"), function (inp) {
      var k = inp.getAttribute("data-prop"), d = T.props[k];
      if (d.kind === "range") {
        inp.oninput = function () {
          p.props[k] = Number(inp.value);
          $("pv-" + k).textContent = fmt(p.props[k], d.step < 1 ? 2 : (d.step % 1 ? 1 : 0)) + d.unit;
          sol = solve(); burnCheck(sol); updateWarnings(); updateSteps(); render(); renderTools();
        };
        inp.onchange = function () { commit(); refresh(true); };
      } else if (d.kind === "select") {
        inp.onchange = function () { p.props[k] = inp.value; commit(); refresh(); };
      } else {
        inp.onchange = function () { p.props[k] = inp.checked; commit(); refresh(); };
      }
    });
  }

  function rotateSel() {
    if (!sel || sel.kind !== "part") return;
    var p = partById(sel.id);
    if (!p) return;
    p.rot = (p.rot + 90) % 360;
    commit();
    refresh(true);
  }
  function deleteSel() {
    if (!sel) return;
    if (sel.kind === "part") {
      parts = parts.filter(function (p) { return p.id !== sel.id; });
      wires = wires.filter(function (w) { return w.a[0] !== sel.id && w.b[0] !== sel.id; });
    } else {
      wires = wires.filter(function (w) { return w.id !== sel.id; });
    }
    sel = null;
    commit();
    refresh(true);
  }

  /* ── 工具栏 ─────────────────────────────── */
  var TI = {
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
    redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>',
    flow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h14M13 7l5 5-5 5"/></svg>',
    zin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-4-4"/></svg>',
    zout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg>',
    clear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  };
  function renderTools() {
    $("tools").innerHTML =
      '<button class="tb" id="tb-undo" type="button" title="撤销 Ctrl+Z"' + (undoStack.length ? "" : " disabled") + ">" + TI.undo + '<span class="lbl">撤销</span></button>' +
      '<button class="tb" id="tb-redo" type="button" title="重做 Ctrl+Y"' + (redoStack.length ? "" : " disabled") + ">" + TI.redo + '<span class="lbl">重做</span></button>' +
      '<span class="tsep"></span><span class="seg"><button class="tb' + (mode === "real" ? " on" : "") + '" id="tb-real" type="button">实物图</button>' +
      '<button class="tb' + (mode === "schem" ? " on" : "") + '" id="tb-schem" type="button">电路图</button></span>' +
      '<button class="tb' + (showFlow ? " on" : "") + '" id="tb-flow" type="button" title="显示电流方向">' + TI.flow + '<span class="lbl">电流</span></button>' +
      '<span class="tsep"></span><button class="tb" id="tb-zout" type="button" title="缩小">' + TI.zout + "</button>" +
      '<button class="tb" id="tb-fit" type="button" title="复位视角">' + Math.round(view.s * 100) + "%</button>" +
      '<button class="tb" id="tb-zin" type="button" title="放大">' + TI.zin + "</button>" +
      '<span class="tsep"></span><button class="tb" id="tb-clear" type="button" title="清空实验台">' + TI.clear + '<span class="lbl">清空</span></button>';
    $("tb-undo").onclick = undo;
    $("tb-redo").onclick = redo;
    $("tb-real").onclick = function () { mode = "real"; render(); renderTools(); };
    $("tb-schem").onclick = function () { mode = "schem"; render(); renderTools(); };
    $("tb-flow").onclick = function () { showFlow = !showFlow; renderTools(); };
    $("tb-zin").onclick = function () { zoomAt(1.2); };
    $("tb-zout").onclick = function () { zoomAt(1 / 1.2); };
    $("tb-fit").onclick = function () { view = { x: 0, y: 0, s: 1 }; setViewBox(); renderTools(); };
    $("tb-clear").onclick = function () {
      if (!parts.length) return;
      if (!window.confirm("清空实验台上的全部器材和导线？")) return;
      parts = []; wires = []; sel = null;
      commit();
      refresh(true);
    };
  }

  /* ── 器材库 ─────────────────────────────── */
  var LIB = (DATA.library && DATA.library.length ? DATA.library : Object.keys(TYPES)).filter(function (t) { return TYPES[t]; });
  function tileSvg(type) {
    var T = TYPES[type];
    var pad = 14, w = T.w + pad * 2, h = T.h + pad * 2 + 20;
    var fake = { id: "tile", type: type, x: 0, y: 0, rot: 0, props: defaultProps(type) };
    var st = type === "ammeter" || type === "voltmeter" ? { range: T.ranges.r1, val: 0, connected: false } : null;
    var terms = "";
    Object.keys(T.terms).forEach(function (t) {
      var d = T.terms[t];
      terms += '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="6" fill="url(#g-brass)" stroke="' + termColor(fake, t) + '" stroke-width="2.5"/>';
    });
    return '<svg viewBox="' + (-w / 2) + " " + (-h / 2 + 4) + " " + w + " " + h + '">' + defs() + DRAW[type](fake, st, false) + terms + "</svg>";
  }
  function renderLib() {
    var cats = CATS.filter(function (c) { return c === "全部" || LIB.some(function (t) { return TYPES[t].cat === c; }); });
    $("lib-cats").innerHTML = cats.length > 2 ? cats.map(function (c) { return '<button type="button" class="' + (c === catNow ? "on" : "") + '" data-cat="' + c + '">' + c + "</button>"; }).join("") : "";
    Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function (b) {
      b.onclick = function () { catNow = b.getAttribute("data-cat"); renderLib(); };
    });
    $("lib-grid").innerHTML = LIB.filter(function (t) { return catNow === "全部" || TYPES[t].cat === catNow; }).map(function (t) {
      return '<div class="tile" data-type="' + t + '">' + tileSvg(t) + "<span>" + TYPES[t].name + "</span></div>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".tile"), function (tile) {
      tile.addEventListener("pointerdown", function (ev) { startSpawn(tile.getAttribute("data-type"), ev); });
    });
  }

  var spawn = null;
  function startSpawn(type, ev) {
    ev.preventDefault();
    var ghost = document.createElement("div");
    ghost.className = "spawn-ghost";
    ghost.innerHTML = tileSvg(type);
    ghost.style.display = "none";
    document.body.appendChild(ghost);
    spawn = { type: type, sx: ev.clientX, sy: ev.clientY, ghost: ghost, moved: false };
    window.addEventListener("pointermove", moveSpawn);
    window.addEventListener("pointerup", endSpawn);
    window.addEventListener("pointercancel", endSpawn);
  }
  function moveSpawn(ev) {
    if (!spawn) return;
    if (Math.hypot(ev.clientX - spawn.sx, ev.clientY - spawn.sy) > 5) spawn.moved = true;
    if (!spawn.moved) return;
    spawn.ghost.style.display = "block";
    spawn.ghost.style.left = (ev.clientX - 46) + "px";
    spawn.ghost.style.top = (ev.clientY - 35) + "px";
  }
  function freeSpot() {
    var cx = view.x + WORLD_W / view.s / 2, cy = view.y + WORLD_H / view.s / 2;
    for (var k = 0; k < 24; k++) {
      var x = cx + ((k % 5) - 2) * 150, y = cy + (Math.floor(k / 5) - 1) * 130;
      var hit = parts.some(function (p) { return Math.abs(p.x - x) < 110 && Math.abs(p.y - y) < 90; });
      if (!hit) return [x, y];
    }
    return [cx, cy];
  }
  function endSpawn(ev) {
    if (!spawn) return;
    var s = spawn;
    spawn = null;
    window.removeEventListener("pointermove", moveSpawn);
    window.removeEventListener("pointerup", endSpawn);
    window.removeEventListener("pointercancel", endSpawn);
    s.ghost.remove();
    var pos = null;
    if (!s.moved) pos = freeSpot();
    else {
      var r = svg.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        var w = toWorld(ev.clientX, ev.clientY);
        pos = [Math.round(w[0] / SNAP) * SNAP, Math.round(w[1] / SNAP) * SNAP];
      }
    }
    if (!pos) return;
    var p = makePart(s.type, pos[0], pos[1], 0);
    parts.push(p);
    sel = { kind: "part", id: p.id };
    commit();
    refresh(true);
  }

  /* ── 实验台交互 ─────────────────────────────── */
  var drag = null;
  function closestAttr(el, name) {
    while (el && el !== svg) {
      if (el.getAttribute && el.getAttribute(name) != null) return el;
      el = el.parentNode;
    }
    return null;
  }
  function nearestTerm(x, y, exclude) {
    var best = null, bd = 22 / Math.sqrt(view.s);
    parts.forEach(function (p) {
      Object.keys(TYPES[p.type].terms).forEach(function (t) {
        var k = tkey(p.id, t);
        if (k === exclude) return;
        var q = termPos(p, t), d = Math.hypot(q[0] - x, q[1] - y);
        if (d < bd) { bd = d; best = { pid: p.id, t: t, k: k, pos: q }; }
      });
    });
    return best;
  }

  svg.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0 && ev.pointerType === "mouse") return;
    var w = toWorld(ev.clientX, ev.clientY);
    var t = ev.target;
    var term = closestAttr(t, "data-term");
    var rotH = closestAttr(t, "data-rot");
    var delH = closestAttr(t, "data-del");
    var knob = closestAttr(t, "data-knob");
    var partEl = closestAttr(t, "data-part");
    var wireEl = closestAttr(t, "data-wire");
    try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
    if (rotH) { rotateSel(); return; }
    if (delH) { deleteSel(); return; }
    if (term) {
      var parts2 = term.getAttribute("data-term").split(":");
      var p0 = partById(parts2[0]);
      drag = { kind: "wire", from: termPos(p0, parts2[1]), fromKey: term.getAttribute("data-term"), pid: parts2[0], t: parts2[1] };
      wireDraft = { from: drag.from, to: w, c: WIRE_COLORS[wires.length % WIRE_COLORS.length] };
      render();
      return;
    }
    if (knob && partEl) {
      var pk = partById(partEl.getAttribute("data-part"));
      sel = { kind: "part", id: pk.id };
      drag = { kind: "knob", p: pk };
      renderProps();
      return;
    }
    if (partEl) {
      var p = partById(partEl.getAttribute("data-part"));
      sel = { kind: "part", id: p.id };
      drag = { kind: "move", p: p, ox: w[0] - p.x, oy: w[1] - p.y, sx: ev.clientX, sy: ev.clientY, moved: false, toggle: !!closestAttr(t, "data-toggle") };
      render();
      renderProps();
      return;
    }
    if (wireEl) {
      sel = { kind: "wire", id: wireEl.getAttribute("data-wire") };
      render();
      renderProps();
      return;
    }
    sel = null;
    drag = { kind: "pan", sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
    svg.classList.add("panning");
    render();
    renderProps();
  });

  svg.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    var w = toWorld(ev.clientX, ev.clientY);
    if (drag.kind === "wire") {
      var near = nearestTerm(w[0], w[1], drag.fromKey);
      hotTerm = near ? near.k : null;
      wireDraft.to = near ? near.pos : w;
      render();
    } else if (drag.kind === "move") {
      if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return;
      drag.moved = true;
      drag.p.x = Math.round((w[0] - drag.ox) / SNAP) * SNAP;
      drag.p.y = Math.round((w[1] - drag.oy) / SNAP) * SNAP;
      render();
    } else if (drag.kind === "knob") {
      var local = rotPt(w[0] - drag.p.x, w[1] - drag.p.y, (360 - drag.p.rot) % 360);
      drag.p.props.pos = +clamp((local[0] + 72) / 144, 0, 1).toFixed(2);
      sol = solve(); burnCheck(sol); updateWarnings(); updateSteps(); render(); renderProps();
    } else if (drag.kind === "pan") {
      var r = svg.getBoundingClientRect();
      var k = (WORLD_W / view.s) / Math.max(1, r.width);
      var k2 = (WORLD_H / view.s) / Math.max(1, r.height);
      var kk = Math.max(k, k2);
      view.x = drag.vx - (ev.clientX - drag.sx) * kk;
      view.y = drag.vy - (ev.clientY - drag.sy) * kk;
      setViewBox();
    }
  });

  function endDrag(ev) {
    if (!drag) return;
    var d = drag;
    drag = null;
    svg.classList.remove("panning");
    if (d.kind === "wire") {
      var w = toWorld(ev.clientX, ev.clientY);
      var near = nearestTerm(w[0], w[1], d.fromKey);
      wireDraft = null;
      hotTerm = null;
      if (near) {
        var dup = wires.some(function (x) {
          var a = tkey(x.a[0], x.a[1]), b = tkey(x.b[0], x.b[1]);
          return (a === d.fromKey && b === near.k) || (b === d.fromKey && a === near.k);
        });
        if (!dup) {
          var nw = { id: "w" + (seq++), a: [d.pid, d.t], b: [near.pid, near.t], c: WIRE_COLORS[wires.length % WIRE_COLORS.length] };
          wires.push(nw);
          commit();
        }
      }
      refresh();
      return;
    }
    if (d.kind === "move") {
      if (!d.moved && d.p.type === "switch") {
        d.p.props.closed = !d.p.props.closed;
        commit();
        refresh();
        return;
      }
      if (d.moved) { commit(); refresh(true); }
      return;
    }
    if (d.kind === "knob") { commit(); refresh(true); }
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var w = toWorld(ev.clientX, ev.clientY);
    zoomAt(ev.deltaY < 0 ? 1.1 : 1 / 1.1, w[0], w[1]);
  }, { passive: false });

  window.addEventListener("keydown", function (ev) {
    var tag = (ev.target && ev.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if ((ev.key === "Delete" || ev.key === "Backspace") && sel) { ev.preventDefault(); deleteSel(); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "y") { ev.preventDefault(); redo(); }
    else if (ev.key.toLowerCase() === "r" && sel && sel.kind === "part") rotateSel();
    else if (ev.key === "Escape") { sel = null; render(); renderProps(); }
  });

  $("guide-close").onclick = function () { document.body.classList.add("guide-off"); };
  $("guide-tab").onclick = function () { document.body.classList.remove("guide-off"); };

  /* ── 场景协议 ─────────────────────────────── */
  function getData() {
    return {
      v: 1, engine: "circuit",
      parts: parts.map(function (p) { return { id: p.id, type: p.type, x: p.x, y: p.y, rot: p.rot, props: JSON.parse(JSON.stringify(p.props)) }; }),
      wires: wires.map(function (w) { return { id: w.id, a: w.a.slice(), b: w.b.slice(), c: w.c }; }),
      mode: mode, records: records.slice(),
    };
  }
  function setData(d) {
    if (!d || typeof d !== "object") return;
    loadScene(d);
    renderGuide();
    refresh(true);
  }
  function resetScene() {
    loadScene(DATA.scene);
    view = { x: 0, y: 0, s: 1 };
    renderGuide();
    refresh(true);
    toast("已恢复初始实验台", "ok");
  }
  window.CircuitLab = { getData: getData, setData: setData, reset: resetScene, solve: function () { return sol; }, check: evalCheck, record: recordNow, steps: function () { return doneSteps; } };

  if (window.matchMedia && window.matchMedia("(max-width: 900px)").matches) document.body.classList.add("guide-off");
  loadScene(DATA.scene);
  renderLib();
  renderGuide();
  refresh(true);
  requestAnimationFrame(tick);

  if (window.NB && window.NB.register) {
    window.NB.register({
      getData: getData, setData: setData, reset: resetScene,
      info: function () {
        var I = DATA.intro || {};
        return { purpose: I.purpose, apparatus: I.apparatus, steps: STEPS.map(function (s) { return s.text; }), discussion: I.discussion };
      },
    });
  }
})();
</script>
  <!-- edu-bench:1 -->
</body>
