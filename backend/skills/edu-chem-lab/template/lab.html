<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学虚拟实验台</title>
  <style>
    :root {
      --ink: #1e293b; --muted: #64748b; --line: #e2e8f0;
      --ok: #16a34a; --bad: #dc2626; --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; min-height: 640px; overflow: hidden; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: #f1f5f9; display: flex; flex-direction: column;
    }
    header {
      padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0;
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 2px 0 0; font-size: 12px; color: var(--accent); }
    .badge {
      font-size: 11px; font-weight: 600; color: var(--accent);
      background: #ccfbf1; border-radius: 999px; padding: 2px 10px;
    }
    .eq {
      margin-left: auto; font-size: 13px; background: #f8fafc; border: 1px solid var(--line);
      border-radius: 10px; padding: 6px 10px; font-family: ui-serif, serif;
    }
    .wrap {
      flex: 1; display: grid; grid-template-columns: 196px minmax(0, 1fr) 200px;
      min-height: 0; min-width: 0; overflow: hidden;
    }
    @media (max-width: 720px) {
      html, body { height: auto; overflow: auto; }
      .wrap { grid-template-columns: 1fr; min-height: 0; }
      .log-col { border-left: 0; border-top: 1px solid var(--line); max-height: 220px; }
      .palette { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
    }
    .log-col {
      background: #fff; min-width: 0; min-height: 0; border-left: 1px solid var(--line);
      padding: 12px; display: flex; flex-direction: column; overflow: hidden;
    }
    .sec-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 8px 0; flex-shrink: 0; }
    #steps { flex-shrink: 0; }
    #log { flex: 1; min-height: 0; overflow-y: auto; }
    .stage { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: #eef3f8; overflow: hidden; }
    .stage-hint {
      flex-shrink: 0; margin: 0; padding: 8px 12px; font-size: 13px; line-height: 1.45;
      background: #fff; border-bottom: 1px solid var(--line); color: var(--ink);
    }
    #view { flex: 1; width: 100%; min-height: 0; }
    #bench { width: 100%; height: 100%; display: block; }
    .slot { pointer-events: none; }
    .slot-dash { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 5 7; opacity: .7; }
    .slot.hot .slot-dash { stroke: #0f766e; stroke-width: 2.2; opacity: .95; }
    .slot-label { font-size: 12px; fill: #475569; font-weight: 700; }
    .palette {
      position: relative; z-index: 1; overflow: auto; min-height: 0;
      background: #fff; border-right: 1px solid var(--line); padding: 10px 8px;
    }
    .palette .sec-title { margin: 4px 0 6px; }
    .tiles { display: flex; flex-wrap: wrap; gap: 6px; }
    .tile {
      width: 84px; border: 1px solid var(--line); background: #fff; border-radius: 10px;
      padding: 4px 2px 6px; cursor: grab; user-select: none; text-align: center;
      box-shadow: 0 2px 6px rgba(15,23,42,.05); touch-action: none;
    }
    .tile:active { cursor: grabbing; }
    .tile.placed { opacity: .32; cursor: default; filter: grayscale(.45); }
    .tile.wrong { border-color: var(--bad); background: #fef2f2; }
    .tile .ico { height: 48px; display: flex; align-items: center; justify-content: center; }
    .tile .ico svg { max-width: 42px; max-height: 46px; }
    .tile span { display: block; font-size: 11px; line-height: 1.25; }
    .hidden { display: none !important; }
    .hint-bar { margin: 0; }
    .actions .hint-bar { position: static; max-width: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px 12px; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; font-size: 14px;
      font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
    }
    .choice {
      display: block; width: 100%; text-align: left; margin-bottom: 8px;
      border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px;
      font-size: 13px; cursor: pointer;
    }
    .toast {
      position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
      max-width: 90%; background: #111827; color: #fff; border-radius: 12px;
      padding: 10px 14px; font-size: 13px; display: none; z-index: 5;
    }
    .toast.bad { background: #991b1b; }
    .toast.ok { background: #166534; }
    .ghost {
      position: fixed; z-index: 80; pointer-events: none;
      filter: drop-shadow(0 10px 16px rgba(15,23,42,.25));
    }
    .ghost svg { width: 72px; height: auto; }
    .step { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
    .step.now { color: var(--ink); font-weight: 700; }
    .step.done { color: var(--ok); }
    .obs { font-size: 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 6px 8px; margin-top: 6px; line-height: 1.4; }
    .hazard { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="badge" id="badge">虚拟实验台</div>
      <h1 id="title">化学虚拟实验台</h1>
      <p id="subtitle"></p>
    </div>
    <div class="eq" id="equation"></div>
  </header>
  <div class="wrap">
    <aside class="palette">
      <div class="sec-title">器材 · 拖到同形虚线</div>
      <div class="tiles" id="apparatus"></div>
      <div class="sec-title">药品 · 拖到药品虚线</div>
      <div class="tiles" id="reagents"></div>
    </aside>
    <section class="stage">
      <p class="stage-hint" id="step-hint"></p>
      <div id="view"></div>
      <div class="actions" id="actions"></div>
      <div class="toast" id="toast"></div>
    </section>
    <aside class="log-col">
      <div class="sec-title">实验步骤</div>
      <div id="steps"></div>
      <div class="sec-title">观察与安全</div>
      <div id="log"></div>
    </aside>
  </div>
  <div id="ghost" class="ghost hidden"></div>
  <script type="application/json" id="lab-data">__LAB_DATA__</script>
  <script>__LAB2D_JS__</script>
  <script>
  (function () {
    var DATA = JSON.parse(document.getElementById("lab-data").textContent);
    var selectedA = {};
    var selectedR = {};
    var stepIndex = 0;
    var lockedSelect = false;
    var hazard = 0;
    var okCount = 0;
    var scene = {};
    var drag = null;

    function $(id) { return document.getElementById(id); }
    function report(q, a, correct) {
      try {
        if (window.CW && window.CW.report) window.CW.report({ component: "chem_lab", question: q, answer: a, correct: correct });
        if (correct === true && window.CW && window.CW.correct) window.CW.correct(q, a);
        if (correct === false && window.CW && window.CW.wrong) window.CW.wrong(q, a);
      } catch (e) {}
    }
    function toast(msg, kind) {
      var el = $("toast");
      el.textContent = msg;
      el.className = "toast " + (kind || "");
      el.style.display = "block";
      setTimeout(function () { el.style.display = "none"; }, 2200);
    }
    function addLog(text, bad) {
      var d = document.createElement("div");
      d.className = "obs" + (bad ? " hazard" : "");
      d.textContent = text;
      var box = $("log");
      box.prepend(d);
      while (box.children.length > 6) box.removeChild(box.lastChild);
    }
    function current() { return DATA.steps[stepIndex]; }
    function allItems() { return [].concat(DATA.inventory.apparatus || [], DATA.inventory.reagents || []); }
    function isPlaced(id, reagent) { return reagent ? !!selectedR[id] : !!selectedA[id]; }
    function iconOf(item, reagent) {
      if (!window.Lab2D) return "";
      return window.Lab2D.icon(reagent ? "reagent" : item.id, 42, item.color);
    }

    function neededSlots() {
      var set = {};
      allItems().forEach(function (it) {
        var reagent = (DATA.inventory.reagents || []).some(function (r) { return r.id === it.id; });
        if (it.slot && !isPlaced(it.id, reagent)) set[it.slot] = true;
      });
      return set;
    }
    function refreshSlots() {
      var selecting = current() && current().need === "select" && !lockedSelect;
      if (window.Lab2D) window.Lab2D.setSelecting(selecting, neededSlots());
    }
    function applyScene(extra) {
      extra = extra || {};
      if (!scene._boot && DATA.scene_init) {
        Object.keys(DATA.scene_init).forEach(function (k) { scene[k] = DATA.scene_init[k]; });
        scene._boot = true;
      }
      Object.keys(extra).forEach(function (k) { scene[k] = extra[k]; });
      if (window.Lab2D) {
        (DATA.inventory.apparatus || []).forEach(function (it) {
          window.Lab2D.setPiece(it.id, !!selectedA[it.id]);
        });
        var hasR = (DATA.required_reagents || []).some(function (id) { return selectedR[id]; });
        window.Lab2D.setPiece("reagent", hasR);
        window.Lab2D.applyEffects(Object.assign({ paper: !!selectedA.paper || !!scene.paper }, scene));
      }
      refreshSlots();
    }

    function renderHeader() {
      $("badge").textContent = DATA.badge || "虚拟实验台";
      $("title").textContent = DATA.title;
      $("subtitle").textContent = (DATA.subtitle || "") + (DATA.goal ? " · 目标：" + DATA.goal : "");
      $("equation").textContent = DATA.equation || "";
    }
    function makeTile(item, reagent) {
      var b = document.createElement("div");
      b.className = "tile" + (isPlaced(item.id, reagent) ? " placed" : "");
      b.innerHTML = '<div class="ico">' + iconOf(item, reagent) + "</div><span>" + item.name + "</span>";
      b.addEventListener("pointerdown", function (e) {
        if (e.button != null && e.button !== 0) return;
        startDrag(e, item, reagent);
      });
      return b;
    }
    function renderCabinet() {
      $("apparatus").innerHTML = ""; $("reagents").innerHTML = "";
      (DATA.inventory.apparatus || []).forEach(function (item) { $("apparatus").appendChild(makeTile(item, false)); });
      (DATA.inventory.reagents || []).forEach(function (item) { $("reagents").appendChild(makeTile(item, true)); });
    }
    function renderSteps() {
      $("steps").innerHTML = "";
      DATA.steps.forEach(function (s, i) {
        var d = document.createElement("div");
        d.className = "step" + (i < stepIndex ? " done" : i === stepIndex ? " now" : "");
        d.textContent = (i + 1) + ". " + s.title;
        $("steps").appendChild(d);
      });
    }
    function missingRequired() {
      var miss = [];
      (DATA.required_apparatus || []).forEach(function (id) { if (!selectedA[id]) miss.push(id); });
      (DATA.required_reagents || []).forEach(function (id) { if (!selectedR[id]) miss.push(id); });
      return miss;
    }
    function tryFinishSelect() {
      if (missingRequired().length) return;
      lockedSelect = true;
      okCount += 1;
      addLog("仪器已放到对应虚线工位，药品已加入。", false);
      report(current().title, "拖放组装完成", true);
      toast("组装完成，开始实验", "ok");
      next();
    }
    function placeItem(item, reagent) {
      if (reagent) selectedR[item.id] = true;
      else selectedA[item.id] = true;
      renderCabinet();
      applyScene({});
      addLog("已放置：" + item.name, false);
      report(current().title, "放置 " + item.name, true);
      tryFinishSelect();
    }
    function startDrag(e, item, reagent) {
      if (lockedSelect || !current() || current().need !== "select") return;
      if (isPlaced(item.id, reagent)) return;
      e.preventDefault();
      var g = $("ghost");
      g.innerHTML = iconOf(item, reagent);
      g.classList.remove("hidden");
      drag = { item: item, reagent: reagent, ghost: g };
      moveGhost(e);
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    }
    function moveGhost(e) {
      if (!drag) return;
      drag.ghost.style.left = (e.clientX + 10) + "px";
      drag.ghost.style.top = (e.clientY + 10) + "px";
      if (window.Lab2D) window.Lab2D.hoverSlot(window.Lab2D.hitSlot(e.clientX, e.clientY, drag.item.slot));
    }
    function onMove(e) { moveGhost(e); }
    function onUp(e) {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (!drag) return;
      drag.ghost.classList.add("hidden");
      drag.ghost.innerHTML = "";
      if (window.Lab2D) window.Lab2D.hoverSlot("");
      var hit = window.Lab2D ? window.Lab2D.hitSlot(e.clientX, e.clientY, drag.item.slot) : "";
      var want = drag.item.slot || "";
      var item = drag.item;
      var reagent = drag.reagent;
      drag = null;
      if (want && hit === want) {
        placeItem(item, reagent);
        return;
      }
      hazard += 1;
      addLog((want ? "工位不对：" : "这件东西本实验不用：") + item.name, true);
      report(current().title, "放错 " + item.name, false);
      toast(want ? "请拖到形状相同的虚线位置" : "这件不是本实验需要的", "bad");
      renderCabinet();
      document.querySelectorAll(".tile").forEach(function (t) {
        if (t.textContent.indexOf(item.name) >= 0) {
          t.classList.add("wrong");
          setTimeout(function () { t.classList.remove("wrong"); }, 1200);
        }
      });
    }
    function next(sceneExtra) {
      stepIndex += 1;
      if (stepIndex >= DATA.steps.length) { finish(); return; }
      renderSteps();
      renderActions();
      applyScene(sceneExtra || {});
    }
    function finish() {
      lockedSelect = true;
      $("step-hint").textContent = DATA.complete.title + " · " + DATA.complete.summary;
      $("actions").innerHTML = "";
      addLog(DATA.complete.summary, false);
      addLog("正确操作 " + okCount + " 步" + (hazard ? "，安全失误 " + hazard + " 次。" : "，没有安全失误。"), hazard > 0);
      report(DATA.title, "完成实验", true);
      toast("实验完成", "ok");
      renderSteps();
      refreshSlots();
    }
    function renderActions() {
      var s = current();
      if (!s) return;
      $("step-hint").textContent = s.title + "：" + (s.hint || "");
      var box = $("actions"); box.innerHTML = "";
      if (s.need === "select") {
        var tip = document.createElement("p");
        tip.className = "hint-bar";
        tip.style.margin = "0";
        tip.textContent = "从左侧把器材拖到画布上形状相同的虚线工位，药品拖到「药品」虚线。工位按真实装置摆放。";
        box.appendChild(tip);
      } else if (s.need === "action") {
        var b = document.createElement("button");
        b.className = "btn"; b.textContent = s.action_label || "执行操作";
        b.onclick = function () {
          okCount += 1;
          if (s.phenomenon) addLog(s.phenomenon, false);
          report(s.title, s.action_label || "操作", true);
          toast(s.phenomenon || "操作完成", "ok");
          next(s.scene || {});
        };
        box.appendChild(b);
      } else if (s.need === "choice") {
        (s.choices || []).forEach(function (c) {
          var btn = document.createElement("button");
          btn.type = "button"; btn.className = "choice"; btn.textContent = c.label;
          btn.onclick = function () {
            if (c.correct) {
              okCount += 1;
              addLog(c.ok || "操作正确。", false);
              report(s.title, c.label, true);
              toast(c.ok || "正确", "ok");
              var sc = Object.assign({}, s.scene || {}, c.scene || {});
              if (c.id === "tilt_down") sc.tilt_down = true;
              if (c.id === "tilt_up") sc.tilt_up = true;
              next(sc);
            } else {
              hazard += 1;
              addLog(c.hazard || "这样不安全。", true);
              report(s.title, c.label, false);
              toast(c.hazard || "请重新选择", "bad");
            }
          };
          box.appendChild(btn);
        });
      }
    }

    if (window.Lab2D) window.Lab2D.init($("view"), DATA.scene || "oxygen");
    else toast("实验台未能加载", "bad");
    renderHeader();
    renderCabinet();
    renderSteps();
    renderActions();
    applyScene({});
  })();
  </script>
</body>
</html>
